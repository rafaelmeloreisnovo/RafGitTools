name: Chart Source Ancestry Guard
on:
  pull_request:
    paths:
      - 'tools/verify_chart_source_ancestry_v1.py'
      - 'tests/test_chart_source_ancestry_v1.py'
      - '.github/workflows/chart-source-ancestry-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ancestry-fixtures-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test external-folder and ambiguity falsifiers
        run: python3 -m unittest discover -s tests -p test_chart_source_ancestry_v1.py -v
