name: navigator-canonical-gate-v1

on:
  pull_request:
    paths:
      - 'tools/rafaelia_navigator/rafaelia_navigator.py'
      - 'tools/rafaelia_navigator/rafaelia_navigator_canonical_gate.py'
      - 'tools/rafaelia_navigator/test_canonical_gate.py'
      - '.github/workflows/navigator-canonical-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-gate-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run canonical gate fixtures
        run: python -m unittest -v tools/rafaelia_navigator/test_canonical_gate.py
      - name: Compile producer and gate
        run: python -m py_compile tools/rafaelia_navigator/rafaelia_navigator.py tools/rafaelia_navigator/rafaelia_navigator_canonical_gate.py
