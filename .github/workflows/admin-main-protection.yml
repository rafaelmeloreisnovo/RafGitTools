name: ADMIN · RafGitTools main protection

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact RafGitTools/main SHA immediately before provider apply
        required: true
        type: string
      apply:
        description: Apply protection (false performs authority/SHA plan only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rafgittools-main-protection
  cancel-in-progress: false

jobs:
  protect-main:
    name: Apply + read back main protection
    runs-on: ubuntu-latest
    environment: Pat_environments
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          persist-credentials: false

      - name: Validate exact SHA input
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Validate canonical provider plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_main_provider_enforcement_plan_v3.py

      - name: Apply/read back provider protection
        shell: bash
        env:
          PROVIDER_TOKEN: ${{ secrets.PAT_environments }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=(
            --repo rafaelmeloreisnovo/RafGitTools
            --branch main
            --expected-main-sha "$EXPECTED_MAIN_SHA"
            --plan contracts/MAIN_PROVIDER_ENFORCEMENT_PLAN_20260907.v3.json
            --receipt artifacts/rafgittools-main-provider-enforcement.json
            --token-env PROVIDER_TOKEN
          )
          if [[ "$APPLY" == "true" ]]; then args+=(--apply); fi
          python3 scripts/apply_rafgittools_main_protection.py "${args[@]}"

      - name: Upload sanitized provider receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rafgittools-main-provider-enforcement-${{ github.run_id }}
          path: artifacts/rafgittools-main-provider-enforcement.json
          if-no-files-found: warn
          retention-days: 30
