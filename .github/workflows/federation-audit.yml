name: Federation Audit

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Optional node id failure to simulate"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "configs/rafaelia-federation.json"
      - "configs/workflow-master-index.json"
      - "configs/epistemic-provenance-interop.json"
      - "schemas/workflow-master-index.schema.json"
      - "schemas/epistemic-provenance-interop.schema.json"
      - "scripts/federation/**"
      - "tests/federation/**"
      - "docs/federation/**"
      - "workflows/WORKFLOW_MASTER_INDEX_RAFAELIA.md"
      - ".github/actions-lock.json"
      - "requirements/federation-audit.lock"
      - ".github/workflows/federation-audit.yml"

permissions:
  contents: read

concurrency:
  group: federation-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pinned Python action
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install exact audit dependency
        run: python3 -m pip install --disable-pip-version-check -r requirements/federation-audit.lock

      - name: Validate deterministic federation manifest v1
        run: |
          mkdir -p artifacts
          python3 scripts/federation/watchdog.py \
            --manifest configs/rafaelia-federation.json \
            --report artifacts/federation-watchdog.json

      - name: Validate workflow master index v2
        run: |
          python3 scripts/federation/validate_master_index.py \
            --index configs/workflow-master-index.json \
            --report artifacts/master-index-report.json

      - name: Project epistemic provenance interoperability v1
        run: |
          python3 scripts/federation/epistemic_interop.py \
            --profile configs/epistemic-provenance-interop.json \
            --index configs/workflow-master-index.json \
            --output-dir artifacts \
            --report artifacts/epistemic-interop-report.json

      - name: Run real local rollback drill
        run: |
          python3 scripts/federation/recovery_drill.py \
            --index configs/workflow-master-index.json \
            --node rafgittools \
            --report artifacts/recovery-drill.json

      - name: Validate supply chain and generate SPDX evidence
        run: |
          python3 scripts/federation/supply_chain.py \
            --lock .github/actions-lock.json \
            --workflow .github/workflows/federation-audit.yml \
            --requirements requirements/federation-audit.lock \
            --report artifacts/supply-chain.spdx.json

      - name: Run blind, temporal, ownership, recovery and interop tests
        run: |
          python3 -m pytest -q \
            tests/federation/test_watchdog.py \
            tests/federation/test_master_index.py \
            tests/federation/test_supply_chain.py \
            tests/federation/test_epistemic_interop.py

      - name: Simulate requested failure
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure != '' }}
        run: |
          python3 scripts/federation/recovery_drill.py \
            --index configs/workflow-master-index.json \
            --node "${{ inputs.simulate_failure }}" \
            --report artifacts/federation-failure-simulation.json

      - name: Build checksums and claim boundary
        if: always()
        run: |
          sha256sum \
            configs/rafaelia-federation.json \
            configs/workflow-master-index.json \
            configs/epistemic-provenance-interop.json \
            schemas/workflow-master-index.schema.json \
            schemas/epistemic-provenance-interop.schema.json \
            .github/actions-lock.json \
            requirements/federation-audit.lock \
            artifacts/*.json \
            > artifacts/CHECKSUMS.sha256
          printf '%s\n' \
            'CLAIM_ALLOWED=false' \
            'REMOTE_RUNTIME_PROVEN=false' \
            'LOCAL_FILE_ROLLBACK_DRILLED=true' \
            'REMOTE_RECOVERY=TOKEN_VAZIO' \
            'PROV_FORMAL_CONFORMANCE=TOKEN_VAZIO' \
            'OPENLINEAGE_FORMAL_CONFORMANCE=TOKEN_VAZIO' \
            'SLSA_FORMAL_CONFORMANCE=TOKEN_VAZIO' \
            'SLSA_ATTESTATION=TOKEN_VAZIO' \
            'SPDX_FORMAL_CONFORMANCE=TOKEN_VAZIO' \
            'NIST_AI_RMF_CONFORMANCE=TOKEN_VAZIO' \
            'SUPPLY_CHAIN_ATTESTATION=TOKEN_VAZIO' \
            'AUTOMATIC_CROSS_REPO_WRITE=false' \
            'AUTOMATIC_MERGE=false' \
            > artifacts/CLAIM_BOUNDARY.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: federation-audit-v3-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
