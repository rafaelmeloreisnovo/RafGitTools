name: RAFAELIA Navigator Selftest

on:
  pull_request:
    paths:
      - 'tools/rafaelia_navigator/**'
      - '.github/workflows/rafaelia-navigator-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic private-safe gate
        run: python tools/rafaelia_navigator/rafaelia_navigator.py selftest
