name: 555 10 LATIN cross-repo authority (review only)
on:
  pull_request:
    paths:
      - '.github/workflows/555_10_latin_authority.yml'
      - 'contracts/latin/**'
      - 'scripts/latin/**'
      - 'tests/latin/**'
      - 'docs/latin/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: 555-latin-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Fail-closed test and structure validation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/latin -p 'test_*.py' -v
          python3 scripts/latin/validate_latin_authority.py
      - name: Receipt is NOT approval or administration
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latin-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/latin/authority-receipt.v1.json
          retention-days: 14
          if-no-files-found: error
