name: Android Client Build

on:
  push:
    branches:
      - main
      - codex/finalize-github-client-login-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_CLIENT_ID_DEV: ${{ vars.GITHUB_CLIENT_ID_DEV }}
  GITHUB_CLIENT_ID_PRODUCTION: ${{ vars.GITHUB_CLIENT_ID_PRODUCTION }}
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dkotlin.incremental=false

jobs:
  debug-client:
    name: Test, lint and build devDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Show build contract
        run: |
          java -version
          ./gradlew --version
          echo "OAuth dev client configured: ${{ vars.GITHUB_CLIENT_ID_DEV != '' }}"
          echo "OAuth production client configured: ${{ vars.GITHUB_CLIENT_ID_PRODUCTION != '' }}"

      - name: Run authentication unit tests
        run: ./gradlew --no-daemon testDevDebugUnitTest --tests 'com.rafgittools.ui.screens.auth.*' --stacktrace

      - name: Run full dev unit tests
        run: ./gradlew --no-daemon testDevDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew --no-daemon lintDevDebug --stacktrace

      - name: Assemble installable APK
        run: ./gradlew --no-daemon assembleDevDebug --stacktrace

      - name: Verify APK exists
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-devDebug
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
