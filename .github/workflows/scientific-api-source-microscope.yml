name: Scientific API + Source Microscope

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bounded execution lane
        required: true
        type: choice
        options:
          - repository_source
          - scientific_api
      repository:
        description: Allowlisted repository for repository_source
        required: false
        default: rafaelmeloreisnovo/ChipQuantum
        type: string
      commit:
        description: Exact 40-char lowercase commit SHA for repository_source
        required: false
        type: string
      needles:
        description: Comma-separated source needles
        required: false
        default: poincare,prime,graph,entropy
        type: string
      scientific_source:
        description: Official scientific API source
        required: false
        default: NASA_POWER_DAILY_POINT
        type: choice
        options:
          - NASA_POWER_DAILY_POINT
          - NASA_DONKI_CME
          - NASA_DONKI_GST
          - NOAA_CDO_DATA
      query_json:
        description: JSON query for scientific_api
        required: false
        default: '{"parameters":"T2M","community":"AG","longitude":0,"latitude":0,"start":"20260901","end":"20260902","format":"JSON"}'
        type: string

permissions:
  contents: read

env:
  CLAIM_ALLOWED: 'false'
  PYTHONUNBUFFERED: '1'

jobs:
  source-microscope:
    if: ${{ inputs.mode == 'repository_source' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact RafGitTools source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate microscope contract
        run: python3 -m unittest tests/test_repository_source_microscope.py

      - name: Require exact target SHA
        env:
          TARGET_SHA: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::exact lowercase 40-char SHA required'; exit 2; }

      - name: Run read-only source microscope
        env:
          PAT_ACTIONS: ${{ secrets.PAT_ACTIONS }}
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_SHA: ${{ inputs.commit }}
          NEEDLES: ${{ inputs.needles }}
        run: |
          set -euo pipefail
          test -n "$PAT_ACTIONS" || { echo '::error::PAT_ACTIONS missing'; exit 2; }
          mkdir -p .rafaelia-artifacts/source-microscope
          python3 scripts/repository_source_microscope.py \
            --repository "$TARGET_REPOSITORY" \
            --commit "$TARGET_SHA" \
            --needles "$NEEDLES" \
            --output .rafaelia-artifacts/source-microscope/receipt.json

      - name: Upload microscope receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-microscope-${{ github.run_id }}
          path: .rafaelia-artifacts/source-microscope/
          if-no-files-found: error

  scientific-api:
    if: ${{ inputs.mode == 'scientific_api' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact RafGitTools source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate scientific API contract
        run: python3 -m unittest tests/test_scientific_api_ingest.py

      - name: Fetch official scientific source
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN }}
          SOURCE_ID: ${{ inputs.scientific_source }}
          QUERY_JSON: ${{ inputs.query_json }}
        run: |
          set -euo pipefail
          mkdir -p .rafaelia-artifacts/scientific-api
          python3 scripts/scientific_api_ingest.py \
            --source "$SOURCE_ID" \
            --query-json "$QUERY_JSON" \
            --output .rafaelia-artifacts/scientific-api

      - name: Upload scientific custody receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scientific-api-${{ github.run_id }}
          path: .rafaelia-artifacts/scientific-api/
          if-no-files-found: error
