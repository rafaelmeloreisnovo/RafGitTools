name: Workflow Graph Audit

"on":
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/actions-lock.json'
      - 'contracts/workflow-graph-audit.v1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test analyzer
        run: python3 .github/actions/workflow-graph-audit/audit.py --self-test

      - name: Analyze structure, logic and dependencies
        uses: ./.github/actions/workflow-graph-audit
        with:
          mode: strict-changed
          base-ref: ${{ github.event.pull_request.base.sha }}
          output-json: workflow-graph-audit.json

      - name: Preserve workflow graph evidence
        if: ${{ always() && hashFiles('workflow-graph-audit.json') != '' }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: workflow-graph-audit-${{ github.run_id }}
          path: workflow-graph-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Expose evidence boundary
        if: ${{ always() }}
        run: |
          echo 'WORKFLOW_GRAPH=LEXICAL_STRUCTURAL_INVENTORY'
          echo 'FULL_YAML_AST=TOKEN_VAZIO'
          echo 'LEGACY_MUTABLE_REFS=TRACKED_DEBT'
          echo 'ARTIFACT=EXECUTION_EVIDENCE_NOT_CERTIFICATION'
          echo 'CLAIM_ALLOWED=false'
