name: RafCode Federation Freestanding

on:
  pull_request:
    paths:
      - "native/rafcode_federation_v1/**"
      - ".github/workflows/rafcode-federation-freestanding.yml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "native/rafcode_federation_v1/**"
      - ".github/workflows/rafcode-federation-freestanding.yml"
      - "Makefile"

permissions:
  contents: read

jobs:
  freestanding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact source without external actions
        shell: bash
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Bind toolchain
        run: |
          clang --version
          ld.lld --version
          readelf --version
      - name: Host compile, execution and ELF gates
        run: |
          make -C native/rafcode_federation_v1 clean
          make -C native/rafcode_federation_v1 host test audit HOST_CC=clang
      - name: ARM32 and ARM64 freestanding link gates
        run: |
          make -C native/rafcode_federation_v1 armv7 ARMV7_CC=clang
          make -C native/rafcode_federation_v1 aarch64 AARCH64_CC=clang
          (cd native/rafcode_federation_v1 && sh tools/audit_elf.sh build/armv7/rafcode-federation)
          (cd native/rafcode_federation_v1 && sh tools/audit_elf.sh build/aarch64/rafcode-federation)
