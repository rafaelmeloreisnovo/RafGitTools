name: Freestanding L0 + Optional JVM Orchestration V1

on:
  pull_request:
    paths:
      - 'freestanding/orchestration/**'
      - 'app/src/main/kotlin/com/rafgittools/workspace/FreestandingModulePipeline.kt'
      - 'app/src/test/kotlin/com/rafgittools/workspace/FreestandingModulePipelineTest.kt'
      - 'configs/freestanding-jvm-orchestration.v1.json'
      - 'scripts/validate_freestanding_jvm_orchestration.py'
      - 'docs/architecture/FREESTANDING_JVM_ORCHESTRATION_V1.md'
      - '.github/workflows/freestanding-jvm-orchestration.yml'
  push:
    branches:
      - 'feature/freestanding-jvm-orchestration-v1-*'
    paths:
      - 'freestanding/orchestration/**'
      - 'app/src/main/kotlin/com/rafgittools/workspace/FreestandingModulePipeline.kt'
      - 'app/src/test/kotlin/com/rafgittools/workspace/FreestandingModulePipelineTest.kt'
      - 'configs/freestanding-jvm-orchestration.v1.json'
      - 'scripts/validate_freestanding_jvm_orchestration.py'
      - 'docs/architecture/FREESTANDING_JVM_ORCHESTRATION_V1.md'
      - '.github/workflows/freestanding-jvm-orchestration.yml'

permissions:
  contents: read

jobs:
  l0-freestanding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile zero-runtime-dependency L0 objects
        shell: bash
        run: |
          set -euo pipefail
          CORE=freestanding/orchestration/raf_orchestrator_l0.c
          INC=freestanding/orchestration
          COMMON='-std=c11 -Wall -Wextra -Werror -pedantic -ffreestanding -fno-builtin -fno-stack-protector'

          clang $COMMON -I"$INC" -c "$CORE" -o /tmp/raf_orchestrator_l0.host.o
          clang $COMMON --target=armv7a-none-eabi -I"$INC" -c "$CORE" -o /tmp/raf_orchestrator_l0.armv7.o
          clang $COMMON --target=aarch64-none-elf -I"$INC" -c "$CORE" -o /tmp/raf_orchestrator_l0.aarch64.o

          if nm -u /tmp/raf_orchestrator_l0.host.o | grep -q '[^[:space:]]'; then
            echo 'L0_FAIL: undefined external symbols detected'
            nm -u /tmp/raf_orchestrator_l0.host.o
            exit 1
          fi

          echo 'L0_OBJECT_PASS: host/ARMv7/AArch64 compile; undefined externals=0'

      - name: Execute hosted behavioral harness without external libraries
        shell: bash
        run: |
          set -euo pipefail
          clang \
            -std=c11 -Wall -Wextra -Werror -pedantic -fno-builtin \
            -Ifreestanding/orchestration \
            freestanding/orchestration/raf_orchestrator_l0.c \
            freestanding/orchestration/raf_orchestrator_l0_selftest.c \
            -o /tmp/raf_orchestrator_l0_selftest
          /tmp/raf_orchestrator_l0_selftest
          echo 'L0_BEHAVIOR_PASS: fail-closed/TOKEN_VAZIO/no-downstream-promotion'

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate typed federation contract
        run: python3 scripts/validate_freestanding_jvm_orchestration.py

  jvm-adapter-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute optional hosted JVM adapter unit tests
        run: >-
          ./scripts/gradlew_with_java17.sh
          testDevDebugUnitTest
          --tests com.rafgittools.workspace.FreestandingModulePipelineTest
