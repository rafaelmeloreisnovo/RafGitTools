name: Code Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v4
      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Detect coverage capability
        id: coverage_capability
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew tasks --all | grep -Eq '(^|[[:space:]])jacocoTestReport([[:space:]]|$)'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "coverage_state=READY_TO_GENERATE" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "coverage_state=TOKEN_VAZIO_COVERAGE_NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate coverage report
        if: steps.coverage_capability.outputs.available == 'true'
        run: ./gradlew jacocoTestReport

      - name: Detect coverage artifacts
        id: coverage_artifacts
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for dir in app/build/reports/jacoco app/build/reports/coverage; do
            if [ -d "$dir" ] && find "$dir" -type f -print -quit | grep -q .; then
              found=true
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "evidence_state=EVIDENCED_SCOPED_COVERAGE_REPORT" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.coverage_capability.outputs.available }}" = true ]; then
            echo "evidence_state=TOKEN_VAZIO_COVERAGE_REPORT_NOT_EMITTED" >> "$GITHUB_OUTPUT"
          else
            echo "evidence_state=TOKEN_VAZIO_COVERAGE_NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage reports
        if: steps.coverage_artifacts.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            app/build/reports/jacoco/
            app/build/reports/coverage/
          retention-days: 30
          if-no-files-found: error

      - name: Publish coverage evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Code Coverage Evidence Boundary"
            echo
            echo "- unit_tests: completed before this boundary when this job reaches here"
            echo "- coverage_capability: \`${{ steps.coverage_capability.outputs.coverage_state || 'TOKEN_VAZIO_NOT_EVALUATED' }}\`"
            echo "- coverage_evidence: \`${{ steps.coverage_artifacts.outputs.evidence_state || 'TOKEN_VAZIO_NOT_EVALUATED' }}\`"
            echo "- claim_allowed: \`false\`"
            echo "- boundary: unit-test PASS does not imply coverage evidence; absence of a report is never converted to zero coverage or a generated artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage evidence gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.coverage_artifacts.outputs.found }}" != true ]; then
            echo "Coverage evidence unavailable: ${{ steps.coverage_artifacts.outputs.evidence_state }}" >&2
            exit 2
          fi
