# SPDX-License-Identifier: GPL-3.0-or-later
# SCOPED public-source validation only. No private Drive inputs or secrets.
name: inventarioRAF L0 · scoped native ABI gate
on:
  pull_request:
    paths:
      - 'native/inventarioraf_l0_v1/**'
      - '.github/workflows/inventarioraf-l0-scoped.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source with plain git (no third-party actions)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          git init "$RUNNER_TEMP/inventarioraf-source"
          git -C "$RUNNER_TEMP/inventarioraf-source" fetch --depth=1             https://github.com/rafaelmeloreisnovo/RafGitTools.git "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/inventarioraf-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/inventarioraf-source" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "exact_source_sha=$SOURCE_SHA"
      - name: Host deterministic falsifiers (C)
        run: |
          set -eu
          make -C "$RUNNER_TEMP/inventarioraf-source/native/inventarioraf_l0_v1" test
      - name: Deterministic mutated buffers under ASan/UBSan
        run: |
          set -eu
          make -C "$RUNNER_TEMP/inventarioraf-source/native/inventarioraf_l0_v1" properties
      - name: ARMv7 / ARM64 freestanding ABI objects (not APK)
        run: |
          set -eu
          make -C "$RUNNER_TEMP/inventarioraf-source/native/inventarioraf_l0_v1" objects
          for f in "$RUNNER_TEMP/inventarioraf-source/native/inventarioraf_l0_v1"/build/libinventarioraf-*.so; do
            readelf -h "$f" | grep -E 'Machine:'
            if readelf -d "$f" | grep -q '(NEEDED)'; then exit 1; fi
            sha256sum "$f"
          done
      - name: Claim boundary (invariant)
        run: |
          set -eu
          grep -F 'r->claim_allowed=0u'             "$RUNNER_TEMP/inventarioraf-source/native/inventarioraf_l0_v1/inventarioraf.c"
          echo 'STATUS=SCOPED_CI_ONLY'
          echo 'DEVICE=TOKEN_VAZIO'
          echo 'APK=TOKEN_VAZIO'
          echo 'RELEASE_ALLOWED=false'
