name: Source Gap Triage V1

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'scripts/audit_source_gaps.py'
      - 'scripts/triage_source_gaps.py'
      - 'contracts/source-gap-allowlist.v1.json'
      - '.github/workflows/source-gap-triage-v1.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'scripts/audit_source_gaps.py'
      - 'scripts/triage_source_gaps.py'
      - 'contracts/source-gap-allowlist.v1.json'
      - '.github/workflows/source-gap-triage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-gap-triage-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Scanner self-test
        run: python3 scripts/audit_source_gaps.py --self-test

      - name: Build deterministic triage registry
        run: python3 scripts/triage_source_gaps.py

      - name: Verify fail-closed triage semantics
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('.rafgittools/receipts/source-gap-triage-v1.json')
          with p.open(encoding='utf-8') as fh:
              d = json.load(fh)
          assert d['schema'] == 'RAFGITTOOLS_SOURCE_GAP_TRIAGE_V1'
          assert d['claim_allowed'] is False
          assert d['source_gate_clear'] is (d['blockers'] == 0)
          assert sum(d['priority_counts'].values()) == d['blockers']
          assert sum(d['attention_marker_counts'].values()) == d['warnings']
          assert sum(g['count'] for g in d['groups']) == d['blockers']
          assert sum(g['count'] for g in d['attention_groups']) == d['warnings']
          assert all(g['claim_allowed'] is False for g in d['groups'])
          assert all(g['claim_allowed'] is False for g in d['attention_groups'])
          assert 'TOKEN_VAZIO != 0' in d['invariants']
          assert 'zero executable blockers != zero uncertainty' in d['invariants']
          assert 'source gate clear != runtime/device/evidence claim' in d['invariants']
          print('PASS source-gap triage semantics')
          PY

      - name: Upload triage receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-gap-triage-v1-${{ github.run_id }}
          path: |
            .rafgittools/receipts/source-gap-triage-v1.json
            .rafgittools/receipts/source-gap-triage-v1.json.sha256
          if-no-files-found: error
          retention-days: 30
