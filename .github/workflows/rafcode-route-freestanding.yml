name: RafCode Route Freestanding V1

on:
  pull_request:
    paths:
      - 'native/rafcode_route_v1/**'
      - '.github/workflows/rafcode-route-freestanding.yml'
  push:
    branches: [main]
    paths:
      - 'native/rafcode_route_v1/**'
      - '.github/workflows/rafcode-route-freestanding.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafcode-route-freestanding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Toolchain identity
        run: |
          set -euo pipefail
          clang --version
          nm --version
          readelf --version

      - name: Host KAT and object audit
        run: |
          set -euo pipefail
          make -C native/rafcode_route_v1 clean
          make -C native/rafcode_route_v1 host-test audit HOST_CC=clang

      - name: ARM32 and ARM64 object gates
        run: |
          set -euo pipefail
          make -C native/rafcode_route_v1 armv7-object ARMV7_CC=clang
          make -C native/rafcode_route_v1 aarch64-object AARCH64_CC=clang

      - name: Truth boundary
        run: |
          echo 'PASS here means source/object/KAT gates only.'
          echo 'Physical ARM32/ARM64 execution remains TOKEN_VAZIO until device receipts exist.'
