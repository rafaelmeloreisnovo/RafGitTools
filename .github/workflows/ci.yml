name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_CLIENT_ID_DEV: ${{ vars.GITHUB_CLIENT_ID_DEV }}
  GITHUB_CLIENT_ID_PRODUCTION: ${{ vars.GITHUB_CLIENT_ID_PRODUCTION }}

jobs:
  android-client:
    name: Test, lint and assemble devDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Authentication tests
        id: auth_tests
        continue-on-error: true
        run: >-
          ./gradlew --no-daemon
          testDevDebugUnitTest
          --tests 'com.rafgittools.ui.screens.auth.*'
          --stacktrace

      - name: Full dev unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDevDebugUnitTest --stacktrace

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDevDebug --stacktrace

      - name: Assemble APK
        id: assemble
        continue-on-error: true
        run: ./gradlew --no-daemon assembleDevDebug --stacktrace

      - name: Verify and checksum APK
        id: verify_apk
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          ls -lh "$APK" app/build/outputs/apk/dev/debug/SHA256SUMS.txt

      - name: Upload APK
        if: steps.assemble.outcome == 'success' && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-devDebug
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build result to PR 236
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTH_RESULT: ${{ steps.auth_tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          APK_RESULT: ${{ steps.verify_apk.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rafgittools-ci.md <<EOF
          ## Resultado automático do fechamento RafGitTools

          Commit: \`${GITHUB_SHA}\`

          | Gate | Resultado |
          |---|---|
          | Testes de autenticação | \`${AUTH_RESULT}\` |
          | Testes unitários dev | \`${UNIT_RESULT}\` |
          | Lint Android | \`${LINT_RESULT}\` |
          | Assemble devDebug | \`${ASSEMBLE_RESULT}\` |
          | APK + SHA-256 | \`${APK_RESULT}\` |

          Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/236/comments" \
            --method POST \
            --field body="$(cat /tmp/rafgittools-ci.md)"

      - name: Enforce build gate
        if: always()
        shell: bash
        env:
          AUTH_RESULT: ${{ steps.auth_tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          APK_RESULT: ${{ steps.verify_apk.outcome }}
        run: |
          set -euo pipefail
          for result in "$AUTH_RESULT" "$UNIT_RESULT" "$LINT_RESULT" "$ASSEMBLE_RESULT" "$APK_RESULT"; do
            test "$result" = "success"
          done
