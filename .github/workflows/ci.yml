name: CI

on:
  push:
    branches:
      - main
      - develop
      - codex/finalize-github-client-login-build
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_CLIENT_ID_DEV: ${{ vars.GITHUB_CLIENT_ID_DEV }}
  GITHUB_CLIENT_ID_PRODUCTION: ${{ vars.GITHUB_CLIENT_ID_PRODUCTION }}

jobs:
  android-client:
    name: Test, lint and assemble devDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Authentication tests
        run: >-
          ./gradlew --no-daemon
          testDevDebugUnitTest
          --tests 'com.rafgittools.ui.screens.auth.*'
          --stacktrace

      - name: Full dev unit tests
        run: ./gradlew --no-daemon testDevDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew --no-daemon lintDevDebug --stacktrace

      - name: Assemble APK
        run: ./gradlew --no-daemon assembleDevDebug --stacktrace

      - name: Verify and checksum APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          ls -lh "$APK" app/build/outputs/apk/dev/debug/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-devDebug
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-diagnostics
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
