name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_CLIENT_ID_DEV: ${{ vars.APP_CLIENT_ID_DEV }}
  APP_CLIENT_ID_PRODUCTION: ${{ vars.APP_CLIENT_ID_PRODUCTION }}

jobs:
  coherence-contract:
    name: RAFAELIA coherence / anti-regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute canonical coherence gate
        run: |
          set -eu
          mkdir -p artifacts
          sh scripts/validate_rafaelia_workflow.sh

      - name: Publish coherence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## RAFAELIA coherence / anti-regression"
            echo
            echo "- claim_allowed: \`false\`"
            echo "- automatic_promotion: \`false\`"
            echo "- CI/hash/cron evidence role: operational only"
            echo "- scientific/physical/legal proof: not implied"
            echo
            if [ -f artifacts/uncertainty-urgency-ethics-license-report.json ]; then
              echo "### uncertainty/urgency/ethics/license report"
              echo '```json'
              cat artifacts/uncertainty-urgency-ethics-license-report.json
              echo '```'
            else
              echo "uncertainty report: \`TOKEN_VAZIO_NOT_EMITTED\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coherence receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rafaelia-coherence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

  android-client:
    name: Test, lint and assemble devDebug
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Gradle wrapper
        run: chmod +x gradlew

      - name: Validate Android startup contract
        run: python3 -m unittest discover -s tests -p 'test_validate_runtime_truth.py' -v

      - name: Validate documentation claim boundary
        run: |
          python3 scripts/validate_documentation_claim_boundary.py --strict
          python3 -m unittest discover -s tests -p 'test_validate_documentation_claim_boundary.py' -v

      - name: Authentication tests
        id: auth_tests
        continue-on-error: true
        run: >-
          ./gradlew --no-daemon
          testDevDebugUnitTest
          --tests 'com.rafgittools.ui.screens.auth.*'
          --stacktrace

      - name: Full dev unit tests
        id: unit_tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDevDebugUnitTest --stacktrace

      - name: Lint
        id: lint
        continue-on-error: true
        run: ./gradlew --no-daemon lintDevDebug --stacktrace

      - name: Assemble APK
        id: assemble
        continue-on-error: true
        run: ./gradlew --no-daemon assembleDevDebug --stacktrace

      - name: Verify and checksum APK
        id: verify_apk
        if: steps.assemble.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          ls -lh "$APK" app/build/outputs/apk/dev/debug/SHA256SUMS.txt

      - name: Upload APK
        if: steps.assemble.outcome == 'success' && steps.verify_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-devDebug
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RafGitTools-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish build result to current PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTH_RESULT: ${{ steps.auth_tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          APK_RESULT: ${{ steps.verify_apk.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          case "$PR_NUMBER" in
            *[!0-9]*) echo "invalid PR_NUMBER=$PR_NUMBER" >&2; exit 2 ;;
          esac
          cat > /tmp/rafgittools-ci.md <<EOF
          ## Resultado automático do fechamento RafGitTools

          Commit: \`${GITHUB_SHA}\`

          | Gate | Resultado |
          |---|---|
          | Testes de autenticação | \`${AUTH_RESULT}\` |
          | Testes unitários dev | \`${UNIT_RESULT}\` |
          | Lint Android | \`${LINT_RESULT}\` |
          | Assemble devDebug | \`${ASSEMBLE_RESULT}\` |
          | APK + SHA-256 | \`${APK_RESULT}\` |

          claim_allowed=false

          CI/build/hash constituem evidência operacional do commit observado; não constituem prova científica, física, jurídica ou de release.

          Execução: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --method POST \
            --field body="$(cat /tmp/rafgittools-ci.md)"

      - name: Enforce build gate
        if: always()
        shell: bash
        env:
          AUTH_RESULT: ${{ steps.auth_tests.outcome }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          ASSEMBLE_RESULT: ${{ steps.assemble.outcome }}
          APK_RESULT: ${{ steps.verify_apk.outcome }}
        run: |
          set -euo pipefail
          for result in "$AUTH_RESULT" "$UNIT_RESULT" "$LINT_RESULT" "$ASSEMBLE_RESULT" "$APK_RESULT"; do
            test "$result" = "success"
          done
