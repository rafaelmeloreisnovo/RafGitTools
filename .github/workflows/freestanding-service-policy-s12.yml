name: S12 Freestanding Dependency Contract Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'contracts/freestanding_service_s12.v1.json'
      - 'scripts/validate_freestanding_service_s12.py'
      - 'tests/test_freestanding_service_s12.py'
      - 'AGENTS.md'
      - '.github/workflows/freestanding-service-policy-s12.yml'
  pull_request:
    paths:
      - 'contracts/freestanding_service_s12.v1.json'
      - 'scripts/validate_freestanding_service_s12.py'
      - 'tests/test_freestanding_service_s12.py'
      - 'AGENTS.md'
      - '.github/workflows/freestanding-service-policy-s12.yml'
permissions:
  contents: read
jobs:
  policy_gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
      - name: Verify scoped contract and negative tests
        run: |
          python3 scripts/validate_freestanding_service_s12.py contracts/freestanding_service_s12.v1.json
          python3 -m unittest discover -s tests -p 'test_freestanding_service_s12.py' -v
      - name: Boundary statement
        if: always()
        run: |
          echo 'Policy validation is not binary or Android device validation.'
          echo 'No merge, independent reviewer, physical execution or security attestation by this job.'
