name: RMR PAI Drive Custody — source and hash falsifiers

on:
  pull_request:
    paths:
      - "scripts/drive_custody_rmr_pair_v1.py"
      - "tests/test_drive_custody_rmr_pair_v1.py"
      - ".github/workflows/drive-custody-rmr-v1.yml"
      - "docs/architecture/DRIVE_RMR_PAI_CUSTODY_VERTICAL_V1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rmr-pai-drive-canary:
    name: RMR PAI dual-hash exact-source canary (NO LIVE DRIVE)
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout RafGitTools exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python source-side negative tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_drive_custody_rmr_pair_v1.py -v
      - name: Checkout authorial BLAKE3 RMR at exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafaelmeloreisnovo/BLAKE3
          ref: 584a686ed68d3fb0189797a661884678a78df01b
          path: source-rmr-pai
          persist-credentials: false
      - name: Assert pinned BLAKE3 RMR source identity
        run: |
          set -euo pipefail
          actual="$(git -C source-rmr-pai rev-parse HEAD)"
          test "$actual" = "584a686ed68d3fb0189797a661884678a78df01b"
      - name: Build RMR PAI C BLAKE3 adapter with separate hosted tooling
        run: |
          set -euo pipefail
          cmake -S source-rmr-pai/rmr -B "$RUNNER_TEMP/rmr-build" \
            -DRMR_BUILD_TESTS=OFF \
            -DRMR_BUILD_CRYPTO_RUNTIME=OFF \
            -DRMR_BUILD_TOPOLOGY=OFF \
            -DRMR_BUILD_HWIF=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/rmr-build" --target pai --parallel 2
      - name: Verify dual digests, a chained receipt, and mutation rejection
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raf-canary"
          printf 'RAFAELIA-CANARY-NO-PRIVATE-DATA\n' > "$RUNNER_TEMP/raf-canary/source.bin"
          cp "$RUNNER_TEMP/raf-canary/source.bin" "$RUNNER_TEMP/raf-canary/drive_readback.bin"
          sha="$(sha256sum "$RUNNER_TEMP/raf-canary/source.bin" | cut -d' ' -f1)"
          python3 scripts/drive_custody_rmr_pair_v1.py \
            --source "$RUNNER_TEMP/raf-canary/source.bin" \
            --drive-readback "$RUNNER_TEMP/raf-canary/drive_readback.bin" \
            --provider-sha256 "$sha" \
            --source-commit "$GITHUB_SHA" \
            --source-repo rafaelmeloreisnovo/RafGitTools \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --artifact-id 1 \
            --drive-file-id CI_SIMULATED_NOT_A_DRIVE_OBJECT \
            --previous-receipt-sha256 "$(printf '0%.0s' {1..64})" \
            --pai "$RUNNER_TEMP/rmr-build/pai" \
            --output "$RUNNER_TEMP/raf-canary/custody.json"
          python3 - "$RUNNER_TEMP/raf-canary/custody.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["readback_result"]=="BYTES_MATCH_DUAL_HASH"
          assert d["claim_allowed"] is False
          assert d["provider_identity_status"]=="CALLER_SUPPLIED_CHECK_PROVIDER_READBACK_SEPARATELY"
          PY
          printf 'X' >> "$RUNNER_TEMP/raf-canary/drive_readback.bin"
          if python3 scripts/drive_custody_rmr_pair_v1.py \
            --source "$RUNNER_TEMP/raf-canary/source.bin" \
            --drive-readback "$RUNNER_TEMP/raf-canary/drive_readback.bin" \
            --provider-sha256 "$sha" \
            --source-commit "$GITHUB_SHA" \
            --source-repo rafaelmeloreisnovo/RafGitTools \
            --workflow-run-id "$GITHUB_RUN_ID" --artifact-id 1 \
            --drive-file-id CI_SIMULATED_NOT_A_DRIVE_OBJECT \
            --previous-receipt-sha256 "$(printf '0%.0s' {1..64})" \
            --pai "$RUNNER_TEMP/rmr-build/pai" \
            --output "$RUNNER_TEMP/raf-canary/should_not_exist.json"; then
            echo "NEGATIVE_FAIL: changed readback accepted" >&2; exit 1
          fi
          test ! -e "$RUNNER_TEMP/raf-canary/should_not_exist.json"
      - name: Upload sanitised canary receipt only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drive-custody-rmr-canary-${{ github.run_id }}
          path: ${{ runner.temp }}/raf-canary/custody.json
          retention-days: 14
