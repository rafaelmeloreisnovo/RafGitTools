name: Source Gap Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-gap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test scanner
        run: python3 scripts/audit_source_gaps.py --self-test

      - name: Scan compiled source
        run: python3 scripts/audit_source_gaps.py --no-receipt
