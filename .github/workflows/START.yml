        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check enumeration custody tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_audit_commit_checks.py -v

  federation:
    name: '04 · Federation / master-index + provenance'
    needs: [plan, coherence]
    if: needs.plan.outputs.federation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
