    # S7: independent, nonpromoting docs check moved inside the canonical
    # single-root orchestrator. The historical YAML is archived byte-for-byte.
    # This job does not depend on topology/coherence: its failures stay visible.
    name: '05Z · Docs Integrity / source references (scoped)'
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && (inputs.mode == 'docs' || inputs.mode == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
      - name: Python isolated tests (no network)
        run: python3 -m unittest discover -s tools -p 'test_doc_ref_integrity_gate.py' -v
      - name: Current navigation documents (blocking, scoped)
        run: |
          python3 tools/doc_ref_integrity_gate.py \
            --file README.md \
            --file docs/INDEX.md \
            --file docs/RAFAELIA_DOCS_RECONCILIATION_20261025.md \
            --file docs/RAFAELIA_ROOT_CENSUS_20261025.md --file tools/rafymlc/README.md
      - name: Historical Markdown audit (nonblocking inventory)
        run: python3 tools/doc_ref_integrity_gate.py --all --audit-only

  docs:
    name: '05 · Documentation / claim boundary'
    needs: [plan, coherence]
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Validate docs policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/validate_documentation_claim_boundary.py ]]; then
            python3 scripts/validate_documentation_claim_boundary.py --strict
          fi
          if [[ -f scripts/validate_delivery_map.py ]]; then
            python3 scripts/validate_delivery_map.py
          fi
          test -f README.md
          test -s README.md

  android:
    name: '06 · Android / test + lint + devDebug APK'
    needs: [plan, coherence]
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: P0 · Kotlin/KSP/Hilt/lint toolchain admission before SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_android_toolchain_matrix.py
          python3 tools/validate_android_dependency_bundle.py
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
      - name: Prepare build environment
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          [[ -f scripts/gradlew_with_java17.sh ]] && chmod +x scripts/gradlew_with_java17.sh || true
          [[ -f scripts/prepare_local_properties.sh ]] && chmod +x scripts/prepare_local_properties.sh || true
          [[ -f scripts/apply_formula_ci_zip.sh ]] && chmod +x scripts/apply_formula_ci_zip.sh || true
          if [[ -f formula_ci.zip && -x scripts/apply_formula_ci_zip.sh ]]; then
            ./scripts/apply_formula_ci_zip.sh formula_ci.zip
          fi
          if [[ -x scripts/prepare_local_properties.sh ]]; then
            ./scripts/prepare_local_properties.sh
          else
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
      # Run app-specific CI first. An unrelated native-fixture failure must not
      # conceal the Kotlin/Compose/Dependabot gate result.
      - name: Unit tests
        run: ./gradlew --no-daemon testDevDebugUnitTest --stacktrace
      - name: Compile device route instrumentation APK
        run: ./gradlew --no-daemon assembleDevDebugAndroidTest --stacktrace
      # App APK must be reproducible and hashed even if independent lint
      # or native fixtures later fail. APK is DEBUG ARTIFACT, never release.
      - name: Assemble devDebug
        run: ./gradlew --no-daemon assembleDevDebug --stacktrace
      - name: Verify APK and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK" | tee app/build/outputs/apk/dev/debug/SHA256SUMS.txt
          tools/rafandroid/rafandroid dex-gate "$APK"
          tools/rafandroid/rafandroid apk-gate "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-06-devDebug-${{ github.run_id }}
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            app/build/outputs/apk/dev/debug/SHA256SUMS.txt
            native/authorial_keyboard_l0/android-demo/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Android lint
        run: ./gradlew --no-daemon lintDevDebug --stacktrace
      - name: RAFANDROID bound Android/NDK gate
        shell: bash
        run: |
          set -euo pipefail
          tools/rafandroid/rafandroid probe
          tools/rafandroid/rafandroid shadow
          tools/rafandroid/rafandroid native-gate tools/rafandroid/templates/minimal-jni/app/src/main/cpp/core.c 24 both
          tools/rafandroid/rafandroid silicon-gate native/silicon_light_v1 24 both
      - name: RAFANDROID minimal Silicon Light APK fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE="$RUNNER_TEMP/rafandroid-silicon-fixture"
          rm -rf "$FIXTURE"
          tools/rafandroid/rafandroid scaffold "$FIXTURE" io.rafaelia.siliconfixture
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > "$FIXTURE/local.properties"
          ./gradlew --no-daemon -p "$FIXTURE" assembleDebug --stacktrace
          APK="$(find "$FIXTURE/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          tools/rafandroid/rafandroid dex-gate "$APK"
          tools/rafandroid/rafandroid apk-gate "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/rafandroid-silicon-fixture.sha256"

      - name: RAFAELIA Authorial Keyboard native demo APK gate
        shell: bash
        run: |
          set -euo pipefail
          DEMO="native/authorial_keyboard_l0/android-demo"
          ./gradlew --no-daemon -p "$DEMO" assembleDebug --stacktrace
          APK="$(find "$DEMO/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/armeabi-v7a/librafkbd_demo.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/librafkbd_demo.so'
          unzip -Z1 "$APK" | grep -Fxq 'AndroidManifest.xml'
          SIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          ALIGN="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign | sort -V | tail -1)"
          test -x "$SIGNER"
          test -x "$ALIGN"
          "$SIGNER" verify "$APK"
          "$ALIGN" -c 4 "$APK"
          sha256sum "$APK" | tee "$DEMO/build/outputs/apk/debug/SHA256SUMS.txt"
          echo 'RAFKBD_NATIVE_APK_SCOPED_GATE=PASS'

      - name: Publish RAFAELIA keyboard test APK (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rafaelia-keyboard-test-apk-${{ github.run_id }}
          path: |
            native/authorial_keyboard_l0/android-demo/build/outputs/apk/debug/*.apk
            native/authorial_keyboard_l0/android-demo/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-06-android-diagnostics-${{ github.run_id }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  security:
    name: '07 · CodeQL / ${{ matrix.language }}'
    needs: [plan, coherence]
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: P0 · CodeQL Kotlin dependency admission
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_android_toolchain_matrix.py
          python3 tools/validate_android_dependency_bundle.py
      - name: Java 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
      - name: Generate local.properties
        if: matrix.language == 'java-kotlin'
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build for Java/Kotlin CodeQL
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache --rerun-tasks assembleDevDebug --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: '/language:${{ matrix.language }}'
      - name: Summarize CodeQL SARIF without source excerpts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/summarize_codeql_sarif.py \
            --input-dir ../results \
            --output "artifacts/codeql-summary-${{ matrix.language }}.json"
      - name: Upload sanitized CodeQL summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-07-codeql-summary-${{ matrix.language }}-${{ github.run_id }}
          path: artifacts/codeql-summary-${{ matrix.language }}.json
          if-no-files-found: warn
          retention-days: 30

  provider_actions:
    name: '08A · Provider actions / exact cross-repo read-only'
    needs: [plan, coherence]
    if: >-
      ${{
        needs.plan.outputs.provider_actions == 'true' &&
        needs.coherence.result == 'success' &&
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'rafaelmeloreisnovo'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      TARGET_REPOSITORY: ${{ needs.plan.outputs.provider_actions_repository }}
      TARGET_SHA: ${{ needs.plan.outputs.provider_actions_sha }}
      TARGET_TASK: ${{ needs.plan.outputs.provider_actions_task }}
    steps:
      - name: Checkout RafGitTools authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate actions capability routing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_provider_capability_environments.py configs/provider-capability-environments.v1.json
          [[ -n "${PROVIDER_ACTIONS_TOKEN:-}" ]] || {
            echo '::error::PAT_ACTIONS repository secret is unavailable'
            exit 3
          }
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$TARGET_TASK" in
            river7_offline)
              [[ "$TARGET_REPOSITORY" == rafaelmeloreisnovo/ChipQuantum ]]
              ;;
            master_coverage_import)
              [[ "$TARGET_REPOSITORY" == rafaelmeloreisnovo/Rafaelia_Private ]]
              ;;
            *)
              echo "::error::unsupported provider actions task"
              exit 2
              ;;
          esac
      - name: Prove least-privilege private source access
        shell: bash
        env:
          PROVIDER_ACTIONS_TOKEN: ${{ secrets.PAT_ACTIONS }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/private_provider_access_gate.py \
            --repo "$TARGET_REPOSITORY" \
            --commit "$TARGET_SHA" \
            --token-env PROVIDER_ACTIONS_TOKEN \
            --receipt artifacts/private-provider-access-receipt.json
      - name: Checkout exact target commit read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.PAT_ACTIONS }}
          path: target
          persist-credentials: false
          fetch-depth: 1
      - name: Verify immutable target identity
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C target rev-parse HEAD)"
          [[ "$observed" == "$TARGET_SHA" ]] || {
            echo '::error::target checkout SHA mismatch'
            exit 4
          }
      - name: Execute bounded provider task
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_TASK" in
            river7_offline)
              (
                cd target
                python3 -m unittest discover -s tests -p 'test_river7_*.py' -v
                python3 experiments/river7_dual_transport/simulate_linear_erasure_743.py \
                  > ../artifacts/RIVER7_LINEAR_ERASURE_743_CROSSREPO_RECEIPT.json
                python3 experiments/river7_dual_transport/simulate_burst_erasure.py \
                  > ../artifacts/RIVER7_BURST_ERASURE_PLACEMENT_CROSSREPO_RECEIPT.json
              )
              python3 scripts/validate_river7_crossrepo_receipts.py \
                --linear artifacts/RIVER7_LINEAR_ERASURE_743_CROSSREPO_RECEIPT.json \
                --burst artifacts/RIVER7_BURST_ERASURE_PLACEMENT_CROSSREPO_RECEIPT.json
              ;;
            master_coverage_import)
              python3 scripts/import_master_coverage.py \
                --source-root target \
                --source-repo "$TARGET_REPOSITORY" \
                --source-sha "$TARGET_SHA" \
                --output artifacts/MASTER_COVERAGE_IMPORT_RECEIPT.json
              ;;
            *)
              echo "::error::unsupported provider actions task"
              exit 2
              ;;
          esac
      - name: Upload provider actions evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-08a-provider-actions-${{ github.run_id }}
          path: |
            artifacts/private-provider-access-receipt.json
            artifacts/RIVER7_LINEAR_ERASURE_743_CROSSREPO_RECEIPT.json
            artifacts/RIVER7_BURST_ERASURE_PLACEMENT_CROSSREPO_RECEIPT.json
            artifacts/MASTER_COVERAGE_IMPORT_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
  private_ci_bridge:
    name: '08B · Private CI bridge / exact-SHA secretless replay'
    needs: [plan, coherence]
    if: >-
      ${{
        needs.plan.outputs.private_ci == 'true' &&
        needs.coherence.result == 'success' &&
        github.actor == 'rafaelmeloreisnovo' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      TARGET_ID: ${{ needs.plan.outputs.private_ci_target_id }}
      TARGET_REPOSITORY: ${{ needs.plan.outputs.private_ci_repository }}
      TARGET_SHA: ${{ needs.plan.outputs.private_ci_sha }}
      TARGET_WORKFLOW_ID: ${{ needs.plan.outputs.private_ci_workflow_id }}
      TARGET_MANIFEST_PATH: ${{ needs.plan.outputs.private_ci_manifest_path }}
    steps:
      - name: Checkout RafGitTools authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate public private-CI registry
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/private_ci_bridge.py validate-registry \
            --registry configs/private-ci/execution-registry.v1.json

      - name: Prove exact private source access
        shell: bash
        env:
          PROVIDER_ACTIONS_TOKEN: ${{ secrets.PAT_ACTIONS }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          [[ -n "${PROVIDER_ACTIONS_TOKEN:-}" ]] || {
            echo '::error::PAT_ACTIONS repository secret is unavailable'
            exit 3
          }
          python3 scripts/private_provider_access_gate.py \
            --repo "$TARGET_REPOSITORY" \
            --commit "$TARGET_SHA" \
            --token-env PROVIDER_ACTIONS_TOKEN \
            --receipt artifacts/private-provider-access-receipt.json

      - name: Checkout exact private target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.PAT_ACTIONS }}
          path: target
          persist-credentials: false
          fetch-depth: 1

      - name: Verify immutable source and no persisted checkout credential
        shell: bash
        run: |
          set -euo pipefail
          observed="$(git -C target rev-parse HEAD)"
          [[ "$observed" == "$TARGET_SHA" ]] || {
            echo '::error::private target checkout SHA mismatch'
            exit 4
          }
          if git -C target config --local --get-regexp 'http\..*\.extraheader' >/dev/null 2>&1; then
            echo '::error::checkout credential header persisted in private target'
            exit 5
          fi
          test -f "target/$TARGET_MANIFEST_PATH"

      - name: Validate private replay manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/private_ci_bridge.py validate-manifest \
            --registry configs/private-ci/execution-registry.v1.json \
            --manifest "target/$TARGET_MANIFEST_PATH" \
            --target-id "$TARGET_ID" \
            --workflow-id "$TARGET_WORKFLOW_ID" \
            --commit "$TARGET_SHA" \
            --source-root target

      - name: Execute secretless bounded replay
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${PAT_ACTIONS:-}" ]]
          [[ -z "${PROVIDER_ACTIONS_TOKEN:-}" ]]
          [[ -z "${GH_TOKEN:-}" ]]
          [[ -z "${GITHUB_TOKEN:-}" ]]
          python3 scripts/private_ci_bridge.py execute \
            --registry configs/private-ci/execution-registry.v1.json \
            --manifest "target/$TARGET_MANIFEST_PATH" \
            --target-id "$TARGET_ID" \
            --workflow-id "$TARGET_WORKFLOW_ID" \
            --commit "$TARGET_SHA" \
            --source-root target \
            --receipt artifacts/private-ci-replay-receipt.json

      - name: Pack and verify deterministic ZIPRAF receipt envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/private_ci_bridge.py pack-receipt \
            --receipt artifacts/private-ci-replay-receipt.json \
            --output artifacts/private-ci-replay-receipt.zipraf
          python3 scripts/private_ci_bridge.py verify-receipt \
            --zipraf artifacts/private-ci-replay-receipt.zipraf

      - name: Assert public artifact boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/private-provider-access-receipt.json
          if [[ -f artifacts/private-ci-replay-receipt.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('artifacts/private-ci-replay-receipt.json').read_text(encoding='utf-8'))
          assert d['claim_allowed'] is False
          b = d['privacy_boundary']
          assert b['secret_value_persisted'] is False
          assert b['secret_available_to_private_subprocess'] is False
          assert b['raw_private_stdout_persisted'] is False
          assert b['raw_private_stderr_persisted'] is False
          assert b['private_source_uploaded_as_public_artifact'] is False
          isolation = b['network_egress_isolation']
          assert isolation['state'] == 'PASS'
          assert isolation['external_ipv4_tcp_connect_blocked'] is True
          PY
          fi

      - name: Upload sanitized private-CI evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-08b-private-ci-${{ github.run_id }}
          path: |
            artifacts/private-provider-access-receipt.json
            artifacts/private-ci-replay-receipt.json
            artifacts/private-ci-replay-receipt.zipraf
          if-no-files-found: warn
          retention-days: 90

  mapa_provider_pat_preflight:
    name: '08Q · Mapa PAT_ENV / read-only provider authority'
    needs: [plan, topology, coherence]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'rafaelmeloreisnovo' &&
        needs.plan.outputs.mode == 'mapa_provider_pat_preflight' &&
        needs.topology.result == 'success' &&
        needs.coherence.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    environment:
      name: Pat_environments
      deployment: false
    steps:
      - name: Checkout exact immutable main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Verify manual source and source-only falsifiers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = rafaelmeloreisnovo
          python3 -m unittest discover -s tests -p 'test_mapa_provider_authority_preflight_v1.py' -v
          python3 scripts/validate_mapa_provider_authority_preflight_v1.py
      - name: PAT_ENV Mapa provider GET-only readback
        shell: bash
        env:
          RAFAELIA_PROVIDER_TOKEN: ${{ secrets.PAT_ENV }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/validate_mapa_provider_authority_preflight_v1.py --probe --receipt artifacts/mapa-provider-pat-env-readback.json
      - name: Upload sanitized Mapa preflight receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-08q-mapa-pat-env-readonly-${{ github.run_id }}
          path: artifacts/mapa-provider-pat-env-readback.json
          if-no-files-found: warn
          retention-days: 30

  provider_environments:
    name: '08P · Provider environments / main enforcement'
    needs: [plan, coherence]
    if: >-
      ${{
        needs.plan.outputs.provider_environments == 'true' &&
        needs.coherence.result == 'success' &&
        github.actor == 'rafaelmeloreisnovo' &&
        github.ref == 'refs/heads/main' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            github.actor == 'rafaelmeloreisnovo' &&
            (
              needs.plan.outputs.provider_operation == 'preflight' ||
              needs.plan.outputs.provider_operation == 'apply_main_protection'
            )
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: Pat_environments
      deployment: false
    env:
      REQUESTED_PROVIDER_OPERATION: ${{ needs.plan.outputs.provider_operation }}
      REQUESTED_EXPECTED_MAIN_SHA: ${{ inputs.provider_expected_main_sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate capability routing
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_provider_capability_environments.py configs/provider-capability-environments.v1.json
      - name: Enforce manual main-only execution boundary
        env:
          PROVIDER_TOKEN: ${{ secrets.PAT_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_ACTOR}" == rafaelmeloreisnovo ]] || {
            echo '::error::provider operation denied to non-owner workflow actor'
            exit 2
          }
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            [[ "${GITHUB_REF}" == refs/heads/main ]] || {
              echo '::error::one-shot preflight push must target main'
              exit 2
            }
            [[ "${GITHUB_ACTOR}" == rafaelmeloreisnovo ]] || {
              echo "::error::unexpected actor for one-shot preflight: ${GITHUB_ACTOR}"
              exit 2
            }
            case "${REQUESTED_PROVIDER_OPERATION}" in
              preflight|apply_main_protection) ;;
              *)
                echo "::error::push-triggered provider lane rejected operation: ${REQUESTED_PROVIDER_OPERATION}"
                exit 2
                ;;
            esac
          elif [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
            echo '::error::provider environment job requires workflow_dispatch or bounded main preflight'
            exit 2
          fi
          [[ "${GITHUB_REF}" == refs/heads/main ]] || {
            echo "::error::provider environment job must dispatch from main; observed ${GITHUB_REF}"
            exit 2
          }
          [[ -n "${PROVIDER_TOKEN:-}" ]] || {
            echo '::error::PAT_ENV secret is unavailable after Pat_environments gate'
            exit 3
          }
      - name: Apply or preflight canonical main protection
        env:
          PROVIDER_TOKEN: ${{ secrets.PAT_ENV }}
        if: ${{ needs.plan.outputs.provider_operation != 'federated_preflight' && needs.plan.outputs.provider_operation != 'federated_protect' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target_repo="${GITHUB_REPOSITORY}"
          target_branch="main"
          target_plan="contracts/MAIN_PROVIDER_ENFORCEMENT_PLAN_20260927.v4.json"
          expected="${REQUESTED_EXPECTED_MAIN_SHA:-}"
          [[ -n "$expected" ]] || expected="${GITHUB_SHA}"
          if [[ "${GITHUB_EVENT_NAME}" == push ]] && git diff --name-only HEAD^ HEAD | grep -Fxq "configs/provider-enforcement-stage1.once.json"; then
            target_repo="$(python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("configs/provider-enforcement-stage1.once.json").read_text(encoding="utf-8")); print(d.get("target_repository",""))')"
            target_branch="$(python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("configs/provider-enforcement-stage1.once.json").read_text(encoding="utf-8")); print(d.get("target_branch",""))')"
            expected="$(python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("configs/provider-enforcement-stage1.once.json").read_text(encoding="utf-8")); print(d.get("expected_target_sha",""))')"
            target_plan="$(python3 -c 'import json,pathlib; d=json.loads(pathlib.Path("configs/provider-enforcement-stage1.once.json").read_text(encoding="utf-8")); print(d.get("plan",""))')"
            case "$target_repo" in
              rafaelmeloreisnovo/RafGitTools|rafaelmeloreisnovo/RafPolimata) ;;
              *) echo "::error::unsupported provider enforcement target: $target_repo"; exit 2 ;;
            esac
            [[ "$target_branch" == main ]] || { echo "::error::target branch must be main"; exit 2; }
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::target requires exact lowercase SHA"; exit 2; }
            [[ "$target_plan" == contracts/*.json ]] || { echo "::error::target plan must be contracts JSON"; exit 2; }
          fi
          args=(
            --repo "$target_repo"
            --branch "$target_branch"
            --expected-main-sha "$expected"
            --plan "$target_plan"
            --receipt artifacts/provider-main-enforcement.json
            --token-env PROVIDER_TOKEN
          )
          case "${REQUESTED_PROVIDER_OPERATION}" in
            apply_main_protection)
              args+=(--apply)
              ;;
            rollback_main_protection)
              args+=(--rollback)
              ;;
            preflight)
              ;;
            *)
              echo "::error::unsupported provider operation: ${REQUESTED_PROVIDER_OPERATION}"
              exit 2
              ;;
          esac
          python3 scripts/apply_rafgittools_main_protection.py "${args[@]}"
      - name: Federated admin scoped protection | owner manual only
        if: >-
          ${{
            github.event_name == 'workflow_dispatch' &&
            (
              needs.plan.outputs.provider_operation == 'federated_preflight' ||
              needs.plan.outputs.provider_operation == 'federated_protect'
            )
          }}
        shell: bash
        env:
          PROVIDER_TOKEN: ${{ secrets.PAT_ENV }}
          FED_TARGET_OWNER: ${{ inputs.repository_factory_owner }}
          FED_TARGET_NAME: ${{ inputs.repository_factory_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == rafaelmeloreisnovo ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$FED_TARGET_OWNER" == rafaelmeloreisnovo ]] || {
            echo '::error::federated admin owner not allowlisted'; exit 2;
          }
          [[ "$FED_TARGET_NAME" == Mapa || "$FED_TARGET_NAME" == actions ]] || {
            echo '::error::federated admin repository not allowlisted'; exit 2;
          }
          [[ "${REQUESTED_EXPECTED_MAIN_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::explicit exact target main SHA required'; exit 2;
          }
          case "$REQUESTED_PROVIDER_OPERATION" in
            federated_preflight) suboperation=preflight ;;
            federated_protect) suboperation=protect ;;
            *) echo '::error::operation not approved'; exit 2 ;;
          esac
          python3 scripts/federated_admin_protection_v1.py \
            --repository "$FED_TARGET_OWNER/$FED_TARGET_NAME" \
            --expected-sha "$REQUESTED_EXPECTED_MAIN_SHA" \
            --operation "$suboperation" \
            --receipt artifacts/federated-admin-protection.json
          echo 'FED_ADMIN=REVIEW_RECEIPT_REQUIRED; CLAIM_ALLOWED=false' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload provider enforcement receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-08p-provider-environments-${{ github.run_id }}
          path: |
            artifacts/provider-main-enforcement.json
            artifacts/federated-admin-protection.json
          if-no-files-found: warn
          retention-days: 90

  release:
    name: '08 · Signed release'
    needs: [plan, coherence, android, security]
    if: >-
      ${{
        always() &&
        needs.plan.outputs.release == 'true' &&
        needs.coherence.result == 'success' &&
        needs.android.result == 'success' &&
        needs.security.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      ALLOW_UNSIGNED_RELEASE: 'false'
      RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ""
      - name: Resolve version and validate signing authority
        id: release_meta
        shell: bash
        env:
          MANUAL_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="${MANUAL_VERSION:-}"
          fi
          test -n "$version" || { echo '::error::manual release requires release_version'; exit 2; }
          for key in RELEASE_STORE_FILE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -n "${!key:-}" ]] || { echo "::error::missing signing secret: $key"; exit 3; }
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Prepare signed release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          [[ -f scripts/gradlew_with_java17.sh ]] && chmod +x scripts/gradlew_with_java17.sh || true
          [[ -f scripts/prepare_local_properties.sh ]] && chmod +x scripts/prepare_local_properties.sh || true
          store_file="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | base64 --decode > "$store_file"
          test -s "$store_file"
          {
            echo "RELEASE_STORE_FILE=$store_file"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          if [[ -x scripts/prepare_local_properties.sh ]]; then
            ./scripts/prepare_local_properties.sh
          else
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
      - name: Assemble signed production release
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x scripts/gradlew_with_java17.sh ]]; then
            ./scripts/gradlew_with_java17.sh assembleProductionRelease --stacktrace --info
          else
            ./gradlew --no-daemon assembleProductionRelease --stacktrace --info
          fi
      - name: Package release + changelog
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release_meta.outputs.version }}'
          apk="$(find app/build/outputs/apk/production/release -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          out="app/build/outputs/apk/production/release/RafGitTools-${version}-release.apk"
          mv "$apk" "$out"
          sha256sum "$out" > "${out}.sha256"
          git log --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~10)"..HEAD > CHANGELOG.md || true
          test -s CHANGELOG.md || echo '- Release generated by START pipeline.' > CHANGELOG.md
          echo "apk=$out" >> "$GITHUB_OUTPUT"
      - name: Upload signed release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-08-release-${{ steps.release_meta.outputs.version }}
          path: |
            ${{ steps.package.outputs.apk }}
            ${{ steps.package.outputs.apk }}.sha256
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        if: github.event_name != 'workflow_dispatch' || inputs.publish_github_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.release_meta.outputs.version }}'
          tag="v${version}"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          gh release create "$tag" \
            '${{ steps.package.outputs.apk }}' \
            '${{ steps.package.outputs.apk }}.sha256' \
            --title "Release $tag" \
            --notes-file CHANGELOG.md

  receipt:
    name: '09 · Final receipt / fechamento'
    needs: [plan, topology, coherence, python_tests, federation, docs, docs_integrity, android, security, provider_actions, private_ci_bridge, provider_environments, release, public_data_custody, promotion_hold_pat_agent]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      TOPOLOGY_RESULT: ${{ needs.topology.result }}
      COHERENCE_RESULT: ${{ needs.coherence.result }}
      PYTHON_RESULT: ${{ needs.python_tests.result }}
      FEDERATION_RESULT: ${{ needs.federation.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      DOCS_INTEGRITY_RESULT: ${{ needs.docs_integrity.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
      SECURITY_RESULT: ${{ needs.security.result }}
      PROVIDER_ACTIONS_RESULT: ${{ needs.provider_actions.result }}
      PRIVATE_CI_RESULT: ${{ needs.private_ci_bridge.result }}
      PROVIDER_ENVIRONMENTS_RESULT: ${{ needs.provider_environments.result }}
      RELEASE_RESULT: ${{ needs.release.result }}
      PUBLIC_DATA_RESULT: ${{ needs.public_data_custody.result }}
      PROMOTION_HOLD_RESULT: ${{ needs.promotion_hold_pat_agent.result }}
      ROUTE_MODE: ${{ needs.plan.outputs.mode }}
      ANDROID_REQUIRED: ${{ needs.plan.outputs.android }}
      SECURITY_REQUIRED: ${{ needs.plan.outputs.security }}
      DOCS_REQUIRED: ${{ needs.plan.outputs.docs }}
      DOCS_INTEGRITY_REQUIRED: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'docs' || inputs.mode == 'full')) }}
      FEDERATION_REQUIRED: ${{ needs.plan.outputs.federation }}
    steps:
      - name: Emit append-only pipeline receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 - <<'PY'
          import json, os
          keys = {
              'plan': os.environ['PLAN_RESULT'],
              'topology': os.environ['TOPOLOGY_RESULT'],
              'coherence': os.environ['COHERENCE_RESULT'],
              'python_tests': os.environ['PYTHON_RESULT'],
              'federation': os.environ['FEDERATION_RESULT'],
              'docs': os.environ['DOCS_RESULT'],
              'docs_integrity': os.environ['DOCS_INTEGRITY_RESULT'],
              'android': os.environ['ANDROID_RESULT'],
              'security': os.environ['SECURITY_RESULT'],
              'provider_actions': os.environ['PROVIDER_ACTIONS_RESULT'],
              'private_ci_bridge': os.environ['PRIVATE_CI_RESULT'],
              'provider_environments': os.environ['PROVIDER_ENVIRONMENTS_RESULT'],
              'release': os.environ['RELEASE_RESULT'],
              'public_data_custody': os.environ['PUBLIC_DATA_RESULT'],
              'promotion_hold_pat_agent': os.environ['PROMOTION_HOLD_RESULT'],
          }
          mapped = {
              k: ('TOKEN_VAZIO_NOT_SELECTED' if v == 'skipped' else v.upper())
              for k, v in keys.items()
          }
          failures = [k for k, v in keys.items() if v in {'failure', 'cancelled'}]
          required = {
              'android': os.environ['ANDROID_REQUIRED'] == 'true',
              'security': os.environ['SECURITY_REQUIRED'] == 'true',
              'docs': os.environ['DOCS_REQUIRED'] == 'true',
              'docs_integrity': os.environ['DOCS_INTEGRITY_REQUIRED'] == 'true',
              'federation': os.environ['FEDERATION_REQUIRED'] == 'true',
          }
          missing_required = [
              name for name, selected in required.items()
              if selected and keys[name] != 'success'
          ]
          receipt = {
              'schema': os.environ['PIPELINE_SCHEMA'],
              'mode': os.environ.get('ROUTE_MODE') or 'TOKEN_VAZIO_ROUTE',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'sha': os.environ['EXECUTION_SHA'],
              'execution_sha': os.environ['EXECUTION_SHA'],
              'provider_sha': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'head_ref': os.environ.get('GITHUB_HEAD_REF') or 'TOKEN_VAZIO_NOT_PR',
              'base_ref': os.environ.get('GITHUB_BASE_REF') or 'TOKEN_VAZIO_NOT_PR',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'state': 'FAIL_REQUIRED_GATE' if missing_required else ('FAIL' if failures else 'PASS_WITH_TYPED_SKIPS'),
              'required_gates': required,
              'missing_required_gates': missing_required,
              'stages': mapped,
              'claim_allowed': False,
              'automatic_promotion': False,
              'training_executed': False,
              'append_only': True,
              'legacy_workflows_active': False,
              'legacy_archive': '.github/workflows-legacy-20260907',
          }
          with open('artifacts/START_RECEIPT.json', 'w', encoding='utf-8') as f:
              json.dump(receipt, f, ensure_ascii=False, indent=2, sort_keys=True)
              f.write('\n')
          print(json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True))
          if failures or missing_required:
              raise SystemExit('failed stages: ' + ', '.join(failures) +
                               '; required gates missing: ' + ', '.join(missing_required))
          PY
      - name: Publish receipt summary
        if: always()
        shell: bash
        run: |
          {
            echo '## START final receipt'
            echo
            echo '- single active workflow: `START.yml`'
            echo '- claim_allowed: `false`'
            echo '- automatic_promotion: `false`'
            echo '- training_executed: `false`'
            echo '- skipped optional lanes are typed as `TOKEN_VAZIO_NOT_SELECTED`'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload final receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-09-receipt-${{ github.run_id }}
          path: artifacts/START_RECEIPT.json
          if-no-files-found: error
          retention-days: 90

  public_data_custody:
    name: 'Public data custody / PLECT public-money lane'
    needs: [plan, topology, coherence]
    if: ${{ needs.plan.outputs.public_data == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Pat_environments
    env:
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate public-data custody contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_public_data_custody_ingest.py' -v
          python3 -m json.tool configs/public-data-custody-ingestion.v1.json >/dev/null

      - name: Render RLL branch atlas
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/render_rll_branch_atlas.py \
            --repo instituto-Rafael/relativity-living-light \
            --output artifacts/rll-branch-atlas.json

      - name: Require dedicated Portal credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PORTAL_TRANSPARENCIA_API_KEY:-}" ]]; then
            echo '::error::TOKEN_VAZIO_EXTERNAL_CREDENTIAL: PORTAL_TRANSPARENCIA_API_KEY'
            exit 2
          fi

      - name: Snapshot allowlisted aggregate official data
        shell: bash
        env:
          PUBLIC_DATA_SOURCE: ${{ inputs.public_data_source }}
          PUBLIC_DATA_QUERY_JSON: ${{ inputs.public_data_query_json }}
        run: |
          set -euo pipefail
          python3 scripts/public_data_custody_ingest.py api-snapshot \
            --source "$PUBLIC_DATA_SOURCE" \
            --query-json "$PUBLIC_DATA_QUERY_JSON" \
            --output artifacts/public-data-custody

      - name: Verify privacy and claim boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/public-data-custody/receipt.json
          test -f artifacts/public-data-custody/projection.json
          test ! -e artifacts/public-data-custody/raw.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('artifacts/public-data-custody/receipt.json').read_text(encoding='utf-8'))
          assert receipt['claim_allowed'] is False
          assert receipt['raw_source_persisted'] is False
          assert len(receipt['source_sha256']) == 64
          assert len(receipt['projection_sha256']) == 64
          PY

      - name: Upload custody and RLL-atlas receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-data-custody-${{ github.run_id }}
          path: |
            artifacts/public-data-custody/
            artifacts/rll-branch-atlas.json
          if-no-files-found: warn
          retention-days: 30


  repository_factory_plan:
    name: '09X · Repository factory / offline plan only'
    needs: [plan, topology, coherence]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.plan.outputs.mode == 'repository_factory' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Record offline repo plan without PAT or POST
        shell: bash
        env:
          FACTORY_OWNER: ${{ inputs.repository_factory_owner }}
          FACTORY_NAME: ${{ inputs.repository_factory_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/repository_factory_v1.py --owner "$FACTORY_OWNER" --name "$FACTORY_NAME" --operation plan --receipt artifacts/repository-factory-plan.json
      - name: Upload offline plan receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-factory-plan-${{ github.run_id }}
          path: artifacts/repository-factory-plan.json
          if-no-files-found: error
          retention-days: 30

  repository_factory_pat_preflight:
    name: '09Y · PAT_AGENTS / identity and org preflight (read-only)'
    needs: [plan, topology, coherence]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'rafaelmeloreisnovo' &&
        needs.plan.outputs.mode == 'repository_factory_pat_preflight' &&
        needs.topology.result == 'success' &&
        needs.coherence.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: Pat_environments
      deployment: false
    steps:
      - name: Checkout immutable execution SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Verify no provider writes and no secret fallback
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = rafaelmeloreisnovo
          python3 -m unittest discover -s tests -p test_repository_factory_pat_agents_preflight_v1.py -v
      - name: PAT_AGENTS read-only provider preflight
        shell: bash
        env:
          RAFAELIA_PREFLIGHT_TOKEN: ${{ secrets.PAT_AGENTS }}
          FACTORY_OWNER: ${{ inputs.repository_factory_owner }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/repository_factory_pat_agents_preflight_v1.py --owner "$FACTORY_OWNER" --receipt artifacts/repository-factory-pat-agents-preflight.json
      - name: Upload typed non-secret receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-factory-pat-agents-preflight-${{ github.run_id }}
          path: artifacts/repository-factory-pat-agents-preflight.json
          if-no-files-found: warn
          retention-days: 30

  promotion_hold_pat_agent:
    name: '09Z · PAT_AGENTS / P0 title hold only (owner manual)'
    needs: [plan, topology, coherence]
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        github.actor == 'rafaelmeloreisnovo' &&
        needs.plan.outputs.mode == 'promotion_hold_pat' &&
        needs.topology.result == 'success' &&
        needs.coherence.result == 'success'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: Pat_environments
      deployment: false
    steps:
      - name: Checkout exact protected executor SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Verify bounded target and payload contract without PAT
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = rafaelmeloreisnovo
          python3 -m unittest discover -s tests -p 'test_promotion_hold_pat_agent_v1.py' -v
          python3 scripts/promotion_hold_pat_agent_v1.py --operation validate
      - name: Inspect or apply P0 title using PAT_AGENTS only
        shell: bash
        env:
          RAFAELIA_AGENTS_TOKEN: ${{ secrets.PAT_AGENTS }}
          HOLD_TARGET: ${{ inputs.repository_factory_name }}
          HOLD_PROVIDER_OPERATION: ${{ inputs.provider_operation }}
          PROMOTION_HOLD_CONFIRM: ${{ inputs.provider_operation == 'mark_hold' && 'EXPLICIT_HOLD_ONLY' || '' }}
        run: |
          set -euo pipefail
          case "$HOLD_TARGET" in mapa750|rafpolimata431|rafpolimata432) ;; *) exit 3 ;; esac
          case "$HOLD_PROVIDER_OPERATION" in
            inspect_hold) operation=inspect ;;
            mark_hold) operation=mark ;;
            *) exit 3 ;;
          esac
          mkdir -p artifacts
          python3 scripts/promotion_hold_pat_agent_v1.py \
            --operation "$operation" --target "$HOLD_TARGET" \
            --receipt artifacts/promotion-hold-receipt.json
      - name: Preserve typed non-secret hold receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promotion-hold-${{ github.run_id }}
          path: artifacts/promotion-hold-receipt.json
          if-no-files-found: warn
          retention-days: 30

  blake3_triple_abi_apk:
    name: '10 · BLAKE3 triple APK (RMR / fork / official; dual ABI)'
    needs: [plan, topology]
    if: >-
      ${{ needs.topology.result == 'success' &&
          ((github.event_name == 'pull_request' &&
            github.head_ref == 'feat/blake3-triple-abi-apk-build-bridge-20261015') ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.blake3_historical_replay == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      BLAKE3_FORK_SOURCE_SHA: 46c5f88f073a7aafb062953bc56a2fe8e36089c5
      B3_UPSTREAM_SHA: f55849f89cd85083c1c9daa2c5de20766f309c00
      RMR_SOURCE_SHA: 46c5f88f073a7aafb062953bc56a2fe8e36089c5
    steps:
      - name: Source checkout isolated from RafGitTools CI control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout exact BLAKE3 fork source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blake3-work/fork"
          cd "$RUNNER_TEMP/blake3-work/fork"
          git init -q
          git remote add origin https://github.com/rafaelmeloreisnovo/BLAKE3.git
          git fetch --no-tags --depth=1 origin "$BLAKE3_FORK_SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BLAKE3_FORK_SOURCE_SHA"
          test -s rmr/android/app/src/main/cpp/b3_compare_jni.c
      - name: Checkout official upstream at exact commit
        shell: bash
        run: |
          set -euo pipefail
          fork="$RUNNER_TEMP/blake3-work/fork"
          official="$fork/rmr/android/upstream_official"
          mkdir -p "$official"
          git -C "$official" init -q
          git -C "$official" remote add origin https://github.com/BLAKE3-team/BLAKE3.git
          git -C "$official" fetch --no-tags --depth=1 origin "$B3_UPSTREAM_SHA"
          git -C "$official" checkout --detach FETCH_HEAD
          test "$(git -C "$official" rev-parse HEAD)" = "$B3_UPSTREAM_SHA"
          for name in LICENSE_A2 LICENSE_A2LLVM LICENSE_CC0; do
            test -s "$official/$name"
          done
          echo "BLAKE3_OFFICIAL_DIR=$official" >> "$GITHUB_ENV"
      - name: Configure existing Android build tools without auto-accepting licenses
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          test -x "$JAVA_HOME/bin/java"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          test -x "$sdk/cmdline-tools/latest/bin/sdkmanager"
          "$sdk/cmdline-tools/latest/bin/sdkmanager"             'platforms;android-36' 'build-tools;36.0.0'             'ndk;27.2.12479018' 'cmake;3.22.1'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          version=8.11.1
          expected=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
          mkdir -p "$RUNNER_TEMP/rmr-gradle"
          curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip"             -o "$RUNNER_TEMP/rmr-gradle/gradle.zip"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/rmr-gradle/gradle.zip"             | sha256sum -c --strict
          unzip -q "$RUNNER_TEMP/rmr-gradle/gradle.zip" -d "$RUNNER_TEMP/rmr-gradle"
          echo "$RUNNER_TEMP/rmr-gradle/gradle-$version/bin" >> "$GITHUB_PATH"
      - name: Assemble real Android APK with 3 native libraries times 2 ABIs
        shell: bash
        run: |
          set -euo pipefail
          gradle --project-dir "$RUNNER_TEMP/blake3-work/fork/rmr/android" --no-daemon :app:assembleDebug
      - name: Binary, license and signature gates with receipt
        shell: bash
        run: |
          set -euo pipefail
          fork="$RUNNER_TEMP/blake3-work/fork"
          official="$fork/rmr/android/upstream_official"
          apk="$fork/rmr/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          for abi in armeabi-v7a arm64-v8a; do
            for lib in officialhash forkhash rmrhash; do
              unzip -Z1 "$apk" | grep -Fx "lib/$abi/lib$lib.so"
              unzip -p "$apk" "lib/$abi/lib$lib.so" > "$RUNNER_TEMP/$abi-$lib.so"
              test -s "$RUNNER_TEMP/$abi-$lib.so"
              file "$RUNNER_TEMP/$abi-$lib.so"
            done
          done
          for asset in OFFICIAL_LICENSE_A2 OFFICIAL_LICENSE_A2LLVM OFFICIAL_LICENSE_CC0             LICENSE_RMR LICENSE_A2 LICENSE_A2LLVM LICENSE_CC0             LICENSE_RMR_INDIVIDUAL_RESEARCH_V1.txt THIRD_PARTY_NOTICES_RAFAELIA.md PROVENANCE.txt; do
            unzip -Z1 "$apk" | grep -Fx "assets/$asset"
          done
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -c -p 4 "$apk"
          mkdir -p "$RUNNER_TEMP/blake3-output"
          cp "$apk" "$RUNNER_TEMP/blake3-output/RAFAELIA_BLAKE3_3PATHS_ARM32_ARM64_DEBUG.apk"
          {
            echo "state=APK_CREATED_ABI_LICENSE_SIGNATURE_CHECKED"
            echo "claim_allowed=false"
            echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
            echo "apk_bytes=$(stat -c '%s' "$apk")"
            echo "fork_sha=$BLAKE3_FORK_SOURCE_SHA"
            echo "official_sha=$B3_UPSTREAM_SHA"
            echo "fork_core_sha256=$(sha256sum "$fork/c/blake3.c" | cut -d' ' -f1)"
            echo "official_core_sha256=$(sha256sum "$official/c/blake3.c" | cut -d' ' -f1)"
            echo "abis=armeabi-v7a,arm64-v8a"
            echo "libraries=officialhash,forkhash,rmrhash"
            echo "licenses=OFFICIAL,FORK,RMR_PRESENT"
            echo "signature=DEBUG_VERIFIED"
            echo "physical_arm32=TOKEN_VAZIO"
            echo "physical_arm64=TOKEN_VAZIO"
          } > "$RUNNER_TEMP/blake3-output/RECEIPT.txt"
          cat "$RUNNER_TEMP/blake3-output/RECEIPT.txt"
      - name: Publish single installable APK and scoped receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rafaelia-blake3-triple-abi-debug-${{ github.run_id }}
          path: ${{ runner.temp }}/blake3-output/
          if-no-files-found: error
          retention-days: 14

  atlas_apk:
    name: '10Z · RAFAELIA Atlas standalone · exact source'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate exact HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Atlas files at exact base/head
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"
          if git diff --no-ext-diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(atlas-apk/|docs/atlas/)'; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Atlas unchanged: skip isolated APK build'
          fi
      - name: Compile/test freestanding L0; enforce no INTERNET permission
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          sh atlas-apk/tests/test_core.sh
          ! grep -q 'android.permission.INTERNET' atlas-apk/app/src/main/AndroidManifest.xml
      - name: Java 17
        if: steps.scope.outputs.changed == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Negative SAF provider-boundary tests (21 offline JVM fixtures)
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/atlas-safety-test"
          mkdir -p "$work"
          javac --release 17 -d "$work" \
            atlas-apk/app/src/main/java/org/rafaelia/atlas/InventorySafety.java \
            atlas-apk/tests/InventorySafetyTest.java
          java -cp "$work" org.rafaelia.atlas.InventorySafetyTest
          grep -Fq 'InventorySafety.mayReadRow(rowsSeen)' \
            atlas-apk/app/src/main/java/org/rafaelia/atlas/MainActivity.java
          grep -Fq 'InventorySafety.coverageState(truncated,errors,repeatedIds,unknownMimes)' \
            atlas-apk/app/src/main/java/org/rafaelia/atlas/MainActivity.java
      - name: Android SDK
        if: steps.scope.outputs.changed == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Pin Android build toolchain
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build standalone APK and lint
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p atlas-apk :app:assembleDebug :app:lintDebug --stacktrace
      - name: Verify ABI, signature and exact-source receipt
        if: steps.scope.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          file='atlas-apk/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$file"
          unzip -Z -1 "$file" | grep -Fx 'lib/armeabi-v7a/librafaelia_atlas.so'
          unzip -Z -1 "$file" | grep -Fx 'lib/arm64-v8a/librafaelia_atlas.so'
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "$file"
          mkdir -p atlas-apk/receipts
          {
            echo 'schema=raf.atlas.apk.build.v2'
            echo "source_head=${EXECUTION_SHA}"
            echo "actual_checkout=$(git rev-parse HEAD)"
            echo "apk_sha256=$(sha256sum "$file" | cut -d' ' -f1)"
            echo 'abi=armeabi-v7a,arm64-v8a'
            echo 'device=TOKEN_VAZIO_NOT_RUN'
            echo 'drive_ingestion=TOKEN_VAZIO_NOT_RUN'
            echo 'claim_allowed=false'
          } > atlas-apk/receipts/build.env
      - name: Upload test APK and scoped receipt
        if: steps.scope.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-debug-${{ env.EXECUTION_SHA }}
          if-no-files-found: error
          path: |
            atlas-apk/app/build/outputs/apk/debug/app-debug.apk
            atlas-apk/receipts/build.env
          retention-days: 7
