name: START · RAFAELIA Orchestrated Pipeline

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  schedule:
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline lane'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - fast
          - full
          - android
          - federation
          - security
          - docs
          - release
          - provider_environments
          - private_ci
          - public_data
          - repository_factory
          - repository_factory_pat_preflight
          - mapa_provider_pat_preflight
          - promotion_hold_pat
      repository_factory_owner:
        description: 'Owner allowlist; offline planning only'
        required: false
        default: rafaelmeloreisnovo
        type: choice
        options:
          - rafaelmeloreisnovo
          - instituto-Rafael
      repository_factory_name:
        description: 'Factory name; in promotion_hold_pat mode: mapa750 / rafpolimata431 / rafpolimata432'
        required: false
        default: ''
        type: string
      release_version:
        description: 'Release version without leading v (required for manual release mode)'
        required: false
        default: ''
        type: string
      publish_github_release:
        description: 'Publish GitHub Release after a signed release build'
        required: false
        default: false
        type: boolean
      provider_operation:
        description: 'Provider operation; inspect_hold/mark_hold apply only to promotion_hold_pat mode'
        required: false
        default: preflight
        type: choice
        options:
          - preflight
          - apply_main_protection
          - rollback_main_protection
          - federated_preflight
          - federated_protect
          - inspect_hold
          - mark_hold
      provider_expected_main_sha:
        description: 'Optional exact main SHA guard; defaults to workflow-dispatch SHA'
        required: false
        default: ''
        type: string
      private_ci_target_id:
        description: 'Public registry target id for exact-SHA private CI replay'
        required: false
        default: rafaelia-private
        type: string
      private_ci_target_sha:
        description: 'Exact lowercase 40-hex private repository commit SHA'
        required: false
        default: ''
        type: string
      private_ci_workflow_id:
        description: 'Allowlisted private workflow replay id'
        required: false
        default: documentation-std-mil
        type: choice
        options:
          - documentation-std-mil
          - current-rafaelia-program-governance-v1
          - freestanding-l0-v1
          - hd-cache-phase1
          - hd-cache-phase2
      public_data_source:
        description: 'Allowlisted aggregate official source'
        required: false
        default: PORTAL_DESPESAS_POR_ORGAO
        type: choice
        options:
          - PORTAL_DESPESAS_POR_ORGAO
          - PORTAL_SERVIDORES_POR_ORGAO
      public_data_query_json:
        description: 'JSON query parameters for the allowlisted public endpoint'
        required: false
        default: '{"pagina":1}'
        type: string
      blake3_historical_replay:
        description: 'Opt-in replay of pinned 2026-10-15 BLAKE3 APK; NOT the latest master and NOT a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Deduplicate superseded PR commits and branch pushes; never cancel
  # scheduled, manual provider mutations or immutable tag releases.
  group: start-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) }}

env:
  PIPELINE_SCHEMA: RAFAELIA_START_V1
  EXECUTION_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  CLAIM_ALLOWED: 'false'
  AUTOMATIC_PROMOTION: 'false'
  TRAINING_EXECUTED: 'false'
  PYTHONUNBUFFERED: '1'
  APP_CLIENT_ID_DEV: ${{ vars.APP_CLIENT_ID_DEV || 'local-dev-client-id' }}
  APP_CLIENT_ID_PRODUCTION: ${{ vars.APP_CLIENT_ID_PRODUCTION || 'local-production-client-id' }}

jobs:
  plan:
    name: '00 · Plan / roteamento'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      android: ${{ steps.route.outputs.android }}
      federation: ${{ steps.route.outputs.federation }}
      security: ${{ steps.route.outputs.security }}
      docs: ${{ steps.route.outputs.docs }}
      release: ${{ steps.route.outputs.release }}
      provider_environments: ${{ steps.route.outputs.provider_environments }}
      provider_operation: ${{ steps.route.outputs.provider_operation }}
      provider_actions: ${{ steps.route.outputs.provider_actions }}
      provider_actions_repository: ${{ steps.route.outputs.provider_actions_repository }}
      provider_actions_sha: ${{ steps.route.outputs.provider_actions_sha }}
      provider_actions_task: ${{ steps.route.outputs.provider_actions_task }}
      private_ci: ${{ steps.route.outputs.private_ci }}
      private_ci_target_id: ${{ steps.route.outputs.private_ci_target_id }}
      private_ci_repository: ${{ steps.route.outputs.private_ci_repository }}
      private_ci_sha: ${{ steps.route.outputs.private_ci_sha }}
      private_ci_workflow_id: ${{ steps.route.outputs.private_ci_workflow_id }}
      private_ci_manifest_path: ${{ steps.route.outputs.private_ci_manifest_path }}
      public_data: ${{ steps.route.outputs.public_data }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXECUTION_SHA"
          echo "EXECUTION_SHA=$actual"

      - name: Resolve execution lane
        id: route
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REQUESTED_PROVIDER_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_operation || 'preflight' }}
          REQUESTED_HOLD_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.repository_factory_name || '' }}
          REQUESTED_PRIVATE_CI_TARGET_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ci_target_id || '' }}
          REQUESTED_PRIVATE_CI_TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ci_target_sha || '' }}
          REQUESTED_PRIVATE_CI_WORKFLOW_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.private_ci_workflow_id || '' }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-auto}"
          # A Draft is not a waiver of code/Android validation. Select
          # the required lane using the exact PR diff, offline and fail-closed.
          if [[ "$mode" == auto && "${GITHUB_EVENT_NAME}" == pull_request &&
                "${PR_DRAFT:-false}" == true ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || {
              echo '::error::missing exact base SHA for draft classification'
              exit 2
            }
            git cat-file -e "${base}^{commit}" || {
              echo '::error::PR base commit unavailable; draft cannot be classified'
              exit 2
            }
            mode="$(git diff --no-ext-diff --name-only -z "$base" HEAD | python3 scripts/ci/draft_lane_guard.py)"
            case "$mode" in
              fast|android|full) ;;
              *) echo '::error::invalid draft route'; exit 2 ;;
            esac
            echo "DRAFT_PR_MODE=$mode"
            if [[ "$mode" == fast ]]; then
              echo 'ANDROID_APK_VALIDATION=NOT_RUN (docs/source-only draft)'
              echo 'CODEQL_SECURITY_VALIDATION=NOT_RUN (docs/source-only draft)'
            fi
            echo 'CLAIM_ALLOWED=false'
          fi
          android=false
          federation=false
          security=false
          docs=false
          release=false
          provider_environments=false
          provider_operation="${REQUESTED_PROVIDER_OPERATION:-preflight}"
          provider_actions=false
          provider_actions_repository=""
          provider_actions_sha=""
          provider_actions_task=""
          private_ci=false
          private_ci_target_id=""
          private_ci_repository=""
          private_ci_sha=""
          private_ci_workflow_id=""
          private_ci_manifest_path=""
          public_data=false

          case "${GITHUB_EVENT_NAME}" in
            schedule)
              mode=full
              ;;
            push)
              if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
                mode=release
              fi
              ;;
          esac

          if [[ "$mode" == auto ]]; then
            # Auto is intentionally conservative: core + Android always run.
            android=true
            security=true

            base=""
            if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
              base="${{ github.event.pull_request.base.sha }}"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              base="HEAD^"
            fi

            if [[ -n "$base" ]]; then
              changed="$(git diff --name-only "$base" HEAD || true)"
            else
              changed="$(git ls-files)"
            fi

            if grep -Eq '^(configs/|schemas/|scripts/federation/|tests/federation/|docs/federation/|workflow-master-index\.json|workflows/)' <<<"$changed"; then
              federation=true
            fi
            if grep -Eq '^(docs/|README\.md|.*\.md$)' <<<"$changed"; then
              docs=true
            fi
            if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]] &&
               grep -Fxq 'configs/provider-environment-preflight.once.json' <<<"$changed"; then
              operation="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-environment-preflight.once.json').read_text(encoding='utf-8')).get('operation',''))")"
              [[ "$operation" == preflight ]] || {
                echo "::error::one-shot provider trigger only permits preflight"
                exit 2
              }
              provider_environments=true
              provider_operation=preflight
            fi
            if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]] &&
               grep -Fxq 'configs/provider-enforcement-stage1.once.json' <<<"$changed"; then
              [[ "$provider_environments" == false ]] || {
                echo "::error::multiple provider one-shot triggers changed in one commit"
                exit 2
              }
              operation="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-enforcement-stage1.once.json').read_text(encoding='utf-8')).get('operation',''))")"
              [[ "$operation" == apply_main_protection ]] || {
                echo "::error::stage1 one-shot trigger only permits apply_main_protection"
                exit 2
              }
              provider_environments=true
              provider_operation=apply_main_protection
            fi
            if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]] &&
               grep -Fxq 'configs/provider-actions-preflight.once.json' <<<"$changed"; then
              [[ "$provider_environments" == false ]] || {
                echo "::error::provider actions one-shot cannot share a commit with provider environment mutation"
                exit 2
              }
              operation="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-actions-preflight.once.json').read_text(encoding='utf-8')).get('operation',''))")"
              target_repo="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-actions-preflight.once.json').read_text(encoding='utf-8')).get('target_repository',''))")"
              target_sha="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-actions-preflight.once.json').read_text(encoding='utf-8')).get('target_commit',''))")"
              target_task="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/provider-actions-preflight.once.json').read_text(encoding='utf-8')).get('task',''))")"
              [[ "$operation" == exact_commit_read_and_test ]] || {
                echo "::error::provider actions one-shot only permits exact_commit_read_and_test"
                exit 2
              }
              [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::provider actions target must be an exact lowercase SHA"
                exit 2
              }
              case "$target_task" in
                river7_offline)
                  [[ "$target_repo" == rafaelmeloreisnovo/ChipQuantum ]] || {
                    echo "::error::river7_offline requires rafaelmeloreisnovo/ChipQuantum"
                    exit 2
                  }
                  ;;
                master_coverage_import)
                  [[ "$target_repo" == rafaelmeloreisnovo/Rafaelia_Private ]] || {
                    echo "::error::master_coverage_import requires rafaelmeloreisnovo/Rafaelia_Private"
                    exit 2
                  }
                  ;;
                *)
                  echo "::error::unsupported provider actions task"
                  exit 2
                  ;;
              esac
              provider_actions=true
              provider_actions_repository="$target_repo"
              provider_actions_sha="$target_sha"
              provider_actions_task="$target_task"
            fi
            if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/heads/main ]] &&
               grep -Fxq 'configs/private-ci/replay.once.json' <<<"$changed"; then
              [[ "$provider_environments" == false && "$provider_actions" == false ]] || {
                echo "::error::private CI one-shot cannot share a commit with another privileged provider lane"
                exit 2
              }
              private_operation="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/private-ci/replay.once.json').read_text(encoding='utf-8')).get('operation',''))")"
              private_target_id="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/private-ci/replay.once.json').read_text(encoding='utf-8')).get('target_id',''))")"
              private_target_sha="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/private-ci/replay.once.json').read_text(encoding='utf-8')).get('target_commit',''))")"
              private_workflow_id="$(python3 -c "import json,pathlib; print(json.loads(pathlib.Path('configs/private-ci/replay.once.json').read_text(encoding='utf-8')).get('workflow_id',''))")"
              [[ "$private_operation" == exact_sha_replay ]] || {
                echo "::error::private CI one-shot only permits exact_sha_replay"
                exit 2
              }
              [[ "$private_target_sha" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::private CI one-shot target must be an exact lowercase SHA"
                exit 2
              }
              resolved="$(python3 scripts/private_ci_bridge.py resolve                 --registry configs/private-ci/execution-registry.v1.json                 --target-id "$private_target_id"                 --workflow-id "$private_workflow_id"                 --commit "$private_target_sha")"
              private_ci_target_id="$private_target_id"
              private_ci_repository="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["repository"])' <<<"$resolved")"
              private_ci_sha="$private_target_sha"
              private_ci_workflow_id="$private_workflow_id"
              private_ci_manifest_path="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())["manifest_path"])' <<<"$resolved")"
              private_ci=true
            fi
          fi

          case "$mode" in
            fast)
              ;;
            full)
              android=true; federation=true; security=true; docs=true
              ;;
            android)
              android=true
              ;;
            federation)
              federation=true
              ;;
            security)
              security=true
              ;;
            docs)
              docs=true
              ;;
            release)
              android=true; security=true; release=true
              ;;
            provider_environments)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
                echo "::error::provider_environments is manual-only"
                exit 2
              fi
              case "${REQUESTED_PROVIDER_OPERATION:-preflight}" in
                preflight|apply_main_protection|rollback_main_protection|federated_preflight|federated_protect) ;;
                *)
                  echo "::error::unsupported provider operation: ${REQUESTED_PROVIDER_OPERATION}"
                  exit 2
                  ;;
              esac
              provider_environments=true
              provider_operation="${REQUESTED_PROVIDER_OPERATION:-preflight}"
              ;;
            private_ci)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
                echo "::error::private_ci is manual-only"
                exit 2
              fi
              [[ "${REQUESTED_PRIVATE_CI_TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || {
                echo "::error::private_ci requires an exact lowercase 40-hex target SHA"
                exit 2
              }
              resolved="$(python3 scripts/private_ci_bridge.py resolve --registry configs/private-ci/execution-registry.v1.json --target-id "${REQUESTED_PRIVATE_CI_TARGET_ID}" --workflow-id "${REQUESTED_PRIVATE_CI_WORKFLOW_ID}" --commit "${REQUESTED_PRIVATE_CI_TARGET_SHA}")"
              private_ci_target_id="${REQUESTED_PRIVATE_CI_TARGET_ID}"
              private_ci_repository="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())[\"repository\"])' <<<"$resolved")"
              private_ci_sha="${REQUESTED_PRIVATE_CI_TARGET_SHA}"
              private_ci_workflow_id="${REQUESTED_PRIVATE_CI_WORKFLOW_ID}"
              private_ci_manifest_path="$(python3 -c 'import json,sys; print(json.loads(sys.stdin.read())[\"manifest_path\"])' <<<"$resolved")"
              private_ci=true
              ;;
            repository_factory)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch || "${GITHUB_REF}" != refs/heads/main ]]; then
                echo '::error::repository_factory requires manual main dispatch'
                exit 2
              fi
              ;;
            repository_factory_pat_preflight)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch || "${GITHUB_REF}" != refs/heads/main || "${GITHUB_ACTOR}" != rafaelmeloreisnovo ]]; then
                echo '::error::PAT_AGENTS preflight is manually dispatched from main by the owner only'
                exit 2
              fi
              ;;
            mapa_provider_pat_preflight)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch || "${GITHUB_REF}" != refs/heads/main || "${GITHUB_ACTOR}" != rafaelmeloreisnovo ]]; then
                echo '::error::Mapa PAT_ENV read-only preflight requires owner-initiated workflow_dispatch from protected main'
                exit 2
              fi
              ;;
            promotion_hold_pat)
              [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/main && "${GITHUB_ACTOR}" == rafaelmeloreisnovo ]] || {
                echo '::error::Promotion hold PAT_AGENTS is main/owner/manual only'
                exit 2
              }
              case "${REQUESTED_PROVIDER_OPERATION}" in
                inspect_hold|mark_hold) ;;
                *) echo '::error::Promotion hold requires inspect_hold or mark_hold'; exit 2 ;;
              esac
              case "${REQUESTED_HOLD_TARGET}" in
                mapa750|rafpolimata431|rafpolimata432) ;;
                *) echo '::error::Target must be pinned in promotion hold contract'; exit 2 ;;
              esac
              ;;
            public_data)
              if [[ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]]; then
                echo "::error::public_data is manual-only"
                exit 2
              fi
              public_data=true
              ;;
            auto)
              ;;
            *)
              echo "::error::unsupported pipeline mode: $mode"
              exit 2
              ;;
          esac

          {
            echo "mode=$mode"
            echo "android=$android"
            echo "federation=$federation"
            echo "security=$security"
            echo "docs=$docs"
            echo "release=$release"
            echo "provider_environments=$provider_environments"
            echo "provider_operation=$provider_operation"
            echo "provider_actions=$provider_actions"
            echo "provider_actions_repository=$provider_actions_repository"
            echo "provider_actions_sha=$provider_actions_sha"
            echo "provider_actions_task=$provider_actions_task"
            echo "private_ci=$private_ci"
            echo "private_ci_target_id=$private_ci_target_id"
            echo "private_ci_repository=$private_ci_repository"
            echo "private_ci_sha=$private_ci_sha"
            echo "private_ci_workflow_id=$private_ci_workflow_id"
            echo "private_ci_manifest_path=$private_ci_manifest_path"
            echo "public_data=$public_data"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## START routing'
            echo
            echo "- mode: \`$mode\`"
            echo "- android: \`$android\`"
            echo "- federation: \`$federation\`"
            echo "- security: \`$security\`"
            echo "- docs: \`$docs\`"
            echo "- release: \`$release\`"
            echo "- provider_environments: \`$provider_environments\`"
            echo "- provider_operation: \`$provider_operation\`"
            echo "- provider_actions: \`$provider_actions\`"
            echo "- provider_actions_repository: \`${provider_actions_repository:-TOKEN_VAZIO}\`"
            echo "- provider_actions_sha: \`${provider_actions_sha:-TOKEN_VAZIO}\`"
            echo "- provider_actions_task: \`${provider_actions_task:-TOKEN_VAZIO}\`"
            echo "- private_ci: \`$private_ci\`"
            echo "- private_ci_target_id: \`${private_ci_target_id:-TOKEN_VAZIO}\`"
            echo "- private_ci_repository: \`${private_ci_repository:-TOKEN_VAZIO}\`"
            echo "- private_ci_sha: \`${private_ci_sha:-TOKEN_VAZIO}\`"
            echo "- private_ci_workflow_id: \`${private_ci_workflow_id:-TOKEN_VAZIO}\`"
            echo "- private_ci_manifest_path: \`${private_ci_manifest_path:-TOKEN_VAZIO}\`"
            echo "- public_data: \`$public_data\`"
            echo '- claim_allowed: `false`'
          } >> "$GITHUB_STEP_SUMMARY"

  topology:
    name: '01 · Workflow topology / single-root invariant'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false

      - name: Assert START is the only active YAML workflow
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t active < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print | sort)
          printf '%s\n' "${active[@]}"
          test "${#active[@]}" -eq 1
          test "${active[0]}" = '.github/workflows/START.yml'
          test -d .github/workflows-legacy-20260907

      - name: Run workflow graph audit
        uses: ./.github/actions/workflow-graph-audit
        with:
          mode: report
          output-json: artifacts/workflow-graph-audit.json

      - name: RAFCODE exact source — reuse immutable owned Action
        if: github.event_name == 'pull_request'
        uses: rafaelmeloreisnovo/actions/rafcode/verify-source@47e0ad95703009bfaaa902f605fd3bf69aae4b48
        with:
          expected-sha: ${{ env.EXECUTION_SHA }}

      - name: RAFCODE provisional run/artifact/falsifier receipt — same Actions core
        if: github.event_name == 'pull_request'
        uses: rafaelmeloreisnovo/actions/rafcode/evidence-receipt@885b6f4c4356d5e1cea352653cbe69a4e141d198
        with:
          expected-source-sha: ${{ env.EXECUTION_SHA }}
          artifact-path: README.md
          falsifier-script: .github/rafcode/falsifier_source_integrity.sh
          falsifier-id: SOURCE_DIGEST_NEGATIVE

      - name: Upload workflow topology receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-01-topology-${{ github.run_id }}
          path: artifacts/workflow-graph-audit.json
          if-no-files-found: warn
          retention-days: 30

  coherence:
    name: '02 · Coherence / anti-regression'
    needs: [plan, topology]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXECUTION_SHA }}
          persist-credentials: false
      - name: Draft source routing falsifiers (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_draft_lane_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_dependabot_policy_gate_v1.py' -v
          python3 -m unittest discover -s tests -p 'test_android_dependency_bundle_gate.py' -v
      - name: P0 queue already in main | freestanding native exact-SHA selftest
        shell: bash
        run: |
          set -euo pipefail
          core=scripts/freestanding/session_queue_core_v1.c
          suite=scripts/freestanding/test_session_queue_core_v1.c
          header=scripts/freestanding/session_queue_core_v1.h
          [[ -f "$core" && -f "$suite" && -f "$header" ]] || { echo 'QUEUE707=HOLD_MISSING_SOURCE'; exit 1; }
          command -v clang >/dev/null
          command -v readelf >/dev/null
          workdir="$(mktemp -d)"
          for target in armv7a-linux-gnueabihf aarch64-linux-gnu; do
            clang -target "$target" -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -O1 -Wall -Wextra -Werror -c "$core" -o "$workdir/core-$target.o"
            clang -target "$target" -std=c11 -ffreestanding -fno-builtin -fno-stack-protector -O1 -Wall -Wextra -Werror -c "$suite" -o "$workdir/test-$target.o"
            clang -target "$target" -fuse-ld=lld -nostdlib -r "$workdir/core-$target.o" "$workdir/test-$target.o" -o "$workdir/combined-$target.o"
            unresolved="$(LC_ALL=C readelf -sW "$workdir/combined-$target.o" | awk '$7=="UND" && $8!="" {print $8}')"
            [[ -z "$unresolved" ]] || { echo "QUEUE707=HOLD_EXTERNAL_SYMBOL_$target"; printf '%s\\n' "$unresolved"; exit 1; }
          done
          cat > "$workdir/entry.c" <<'C'
          #include <stdint.h>
          extern uint32_t raf_queue_selftest_v1(void);
          int main(void) { return raf_queue_selftest_v1() == 0u ? 0 : 1; }
