name: Public Repository Assurance Executor

on:
  push:
    branches: [main]
    paths:
      - 'configs/public-repo-assurance-executor.v1.json'
      - 'scripts/check_public_repo_assurance_contract.py'
      - 'data/evidence/github/public-repo-assurance-*.json'
      - '.github/workflows/public-repo-assurance.yml'
  pull_request:
    paths:
      - 'configs/public-repo-assurance-executor.v1.json'
      - 'scripts/check_public_repo_assurance_contract.py'
      - 'data/evidence/github/public-repo-assurance-*.json'
      - '.github/workflows/public-repo-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repo-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Upstream derivative with open provenance must HOLD
        run: python3 scripts/check_public_repo_assurance_contract.py data/evidence/github/public-repo-assurance-blake3-hold.v1.json

      - name: Negative gate — PASS with open gaps must be rejected
        run: |
          set -euo pipefail
          cp data/evidence/github/public-repo-assurance-blake3-hold.v1.json /tmp/item.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/item.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['requested_transition'] = 'PASS'
          p.write_text(json.dumps(d), encoding='utf-8')
          PY
          if python3 scripts/check_public_repo_assurance_contract.py /tmp/item.json; then
            echo 'FAIL: open-gap upstream derivative was promoted to PASS' >&2
            exit 1
          fi
