name: Android CI

on:
  workflow_call:
    inputs:
      build_mode:
        description: "Stages to run"
        required: false
        default: all
        type: string
      run_release_variant:
        description: "Include release variants"
        required: false
        default: false
        type: boolean
      allow_unsigned_release:
        description: "Allow unsigned release variant (internal validation only)"
        required: false
        default: false
        type: boolean
      gradle_args:
        description: "Additional Gradle flags; use --key=value for flags with values"
        required: false
        default: "--stacktrace"
        type: string
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Stages to run"
        required: true
        default: all
        type: choice
        options: [all, build_only, tests_only, lint_only]
      run_release_variant:
        description: "Include release variants"
        required: false
        default: false
        type: boolean
      allow_unsigned_release:
        description: "Allow unsigned release variant (internal validation only)"
        required: false
        default: false
        type: boolean
      gradle_args:
        description: "Additional Gradle flags; use --key=value for flags with values"
        required: false
        default: "--stacktrace"
        type: string

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}-${{ inputs.build_mode }}-${{ inputs.run_release_variant }}
  cancel-in-progress: true

env:
  APP_CLIENT_ID_DEV: ${{ vars.APP_CLIENT_ID_DEV || 'local-dev-client-id' }}
  APP_CLIENT_ID_PRODUCTION: ${{ vars.APP_CLIENT_ID_PRODUCTION || 'local-production-client-id' }}
  ALLOW_UNSIGNED_RELEASE: ${{ inputs.allow_unsigned_release && 'true' || 'false' }}

jobs:
  build:
    name: Build Variants
    if: inputs.build_mode == 'all' || inputs.build_mode == 'build_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.run_release_variant && '["devDebug","productionDebug","devRelease","productionRelease"]' || '["devDebug","productionDebug"]') }}

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Apply CI runtime overlay zip
        run: ./scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: ./scripts/prepare_local_properties.sh

      - name: Prepare executable helpers
        run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh scripts/apply_formula_ci_zip.sh scripts/native/verify_apks.sh

      - name: Validate release-signing policy
        if: contains(matrix.variant, 'Release') && !inputs.allow_unsigned_release
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(RELEASE_STORE_FILE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD)
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::A release matrix cell requires signed release configuration."
            echo "::error::Missing secrets: ${missing[*]}"
            echo "::error::For unsigned internal pipeline validation, set allow_unsigned_release=true explicitly."
            exit 1
          fi

      - name: Assemble selected variant
        env:
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
          VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VARIANT" in
            devDebug|productionDebug|devRelease|productionRelease) ;;
            *) echo "unsupported variant: $VARIANT" >&2; exit 2 ;;
          esac
          read -r -a gradle_args <<< "$GRADLE_ARGS_INPUT"
          for arg in "${gradle_args[@]}"; do
            case "$arg" in
              -*) ;;
              *)
                echo "gradle_args accepts flags only; use --key=value for values: $arg" >&2
                exit 2
                ;;
            esac
          done
          ./scripts/gradlew_with_java17.sh "assemble${VARIANT}" "${gradle_args[@]}"

      - name: Verify release APK ABI/signature state
        if: contains(matrix.variant, 'Release')
        run: ./scripts/native/verify_apks.sh

      - name: Upload APK evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/apk/*.tsv
          if-no-files-found: warn
          retention-days: 14

  test:
    name: Unit Tests
    if: inputs.build_mode == 'all' || inputs.build_mode == 'tests_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Apply CI runtime overlay zip
        run: ./scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: ./scripts/prepare_local_properties.sh

      - name: Prepare executable helpers
        run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh scripts/apply_formula_ci_zip.sh scripts/native/verify_apks.sh

      - name: Run Unit Tests
        env:
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a gradle_args <<< "$GRADLE_ARGS_INPUT"
          for arg in "${gradle_args[@]}"; do
            case "$arg" in
              -*) ;;
              *) echo "gradle_args accepts flags only; use --key=value for values: $arg" >&2; exit 2 ;;
            esac
          done
          ./scripts/gradlew_with_java17.sh \
            testDevDebugUnitTest testProductionDebugUnitTest \
            "${gradle_args[@]}"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Lint
    if: inputs.build_mode == 'all' || inputs.build_mode == 'lint_only'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Apply CI runtime overlay zip
        run: ./scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: ./scripts/prepare_local_properties.sh

      - name: Prepare executable helpers
        run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh scripts/apply_formula_ci_zip.sh scripts/native/verify_apks.sh

      - name: Run Lint
        env:
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
        shell: bash
        run: |
          set -euo pipefail
          read -r -a gradle_args <<< "$GRADLE_ARGS_INPUT"
          for arg in "${gradle_args[@]}"; do
            case "$arg" in
              -*) ;;
              *) echo "gradle_args accepts flags only; use --key=value for values: $arg" >&2; exit 2 ;;
            esac
          done
          ./scripts/gradlew_with_java17.sh \
            lintDevDebug lintProductionDebug \
            "${gradle_args[@]}"

      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports-${{ github.run_id }}
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/lint-results*.xml
            app/build/reports/lint-results*.txt
          if-no-files-found: warn
          retention-days: 14

  summary:
    name: CI Summary
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build, test, lint]
    steps:
      - name: Explain configuration and observed job states
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          RUN_RELEASE_VARIANT: ${{ inputs.run_release_variant }}
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf -v gradle_args_q '%q' "$GRADLE_ARGS_INPUT"
          {
            echo "## Android CI Summary"
            echo "- build_mode: \`$BUILD_MODE\`"
            echo "- run_release_variant: \`$RUN_RELEASE_VARIANT\`"
            echo "- gradle_args(shell-escaped): \`$gradle_args_q\`"
            echo "- build: \`$BUILD_RESULT\`"
            echo "- test: \`$TEST_RESULT\`"
            echo "- lint: \`$LINT_RESULT\`"
            echo "- claim_allowed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"
