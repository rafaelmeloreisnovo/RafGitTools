name: RAFAELIA Atlas APK - isolated build v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'atlas-apk/**'
      - 'docs/atlas/**'
      - '.github/workflows/atlas-apk-v1.yml'
permissions:
  contents: read
concurrency:
  group: atlas-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: L0 host test + privacy guard
        run: |
          sh atlas-apk/tests/test_core.sh
          ! grep -q 'android.permission.INTERNET' atlas-apk/app/src/main/AndroidManifest.xml
      - name: Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build + lint standalone
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon -p atlas-apk :app:assembleDebug :app:lintDebug --stacktrace
      - name: Binary checks and receipt
        run: |
          set -euo pipefail
          file='atlas-apk/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$file"
          unzip -Z -1 "$file" | grep -Fx 'lib/armeabi-v7a/librafaelia_atlas.so'
          unzip -Z -1 "$file" | grep -Fx 'lib/arm64-v8a/librafaelia_atlas.so'
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose "$file"
          mkdir -p atlas-apk/receipts
          {
            echo 'schema=raf.atlas.apk.build.v1'
            echo 'exact_head=${GITHUB_SHA}'
            echo 'debug_apk=true'
            echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)"
            echo 'device=TOKEN_VAZIO_NOT_RUN'
            echo 'drive_ingestion=TOKEN_VAZIO_NOT_RUN'
            echo 'claim_allowed=false'
          } > atlas-apk/receipts/build.env
      - name: Publish only debug test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            atlas-apk/app/build/outputs/apk/debug/app-debug.apk
            atlas-apk/receipts/build.env
          retention-days: 7
