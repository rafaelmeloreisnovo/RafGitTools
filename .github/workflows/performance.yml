name: Performance Metrics

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-size:
    name: APK Size Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          ALLOW_UNSIGNED_RELEASE: "true"
        run: ./gradlew assembleProductionRelease

      - name: Analyze APK size
        id: apk-size
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/production/release -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          test -s "$APK_PATH"
          APK_SIZE="$(du -h "$APK_PATH" | cut -f1)"
          APK_SIZE_BYTES="$(stat -c%s "$APK_PATH")"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "apk_size_bytes=$APK_SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "APK Size: $APK_SIZE ($APK_SIZE_BYTES bytes)"

      - name: Generate APK size report
        shell: bash
        env:
          APK_PATH: ${{ steps.apk-size.outputs.apk_path }}
          APK_SIZE: ${{ steps.apk-size.outputs.apk_size }}
          APK_SIZE_BYTES: ${{ steps.apk-size.outputs.apk_size_bytes }}
        run: |
          set -euo pipefail
          test -n "$APK_PATH"
          case "$APK_SIZE_BYTES" in
            ''|*[!0-9]*) echo "invalid APK_SIZE_BYTES" >&2; exit 2 ;;
          esac
          {
            echo "# APK Size Analysis Report"
            echo
            echo "**APK Size**: $APK_SIZE"
            echo "**Size in bytes**: $APK_SIZE_BYTES"
            echo
          } > apk-report.md

          THRESHOLD=50000000
          if [ "$APK_SIZE_BYTES" -gt "$THRESHOLD" ]; then
            echo "⚠️ **Warning**: APK size exceeds $((THRESHOLD / 1000000))MB threshold" >> apk-report.md
          else
            echo "✅ APK size is within acceptable limits" >> apk-report.md
          fi
          cat apk-report.md

      - name: Upload APK size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-size-report-${{ github.run_id }}
          path: apk-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('apk-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  build-time:
    name: Build Time Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean

      - name: Measure build time
        id: build-time
        shell: bash
        run: |
          set -euo pipefail
          START_TIME="$(date +%s)"
          ./gradlew assembleDevDebug --profile
          END_TIME="$(date +%s)"
          BUILD_TIME=$((END_TIME - START_TIME))
          echo "build_time=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "Build time: ${BUILD_TIME}s"

      - name: Generate build time report
        shell: bash
        env:
          BUILD_TIME: ${{ steps.build-time.outputs.build_time }}
        run: |
          set -euo pipefail
          case "$BUILD_TIME" in
            ''|*[!0-9]*) echo "invalid BUILD_TIME" >&2; exit 2 ;;
          esac
          {
            echo "# Build Time Analysis"
            echo
            echo "**Total build time**: ${BUILD_TIME}s"
            echo
          } > build-time-report.md

          if [ "$BUILD_TIME" -lt 120 ]; then
            echo "✅ Build time is excellent (< 2 minutes)" >> build-time-report.md
          elif [ "$BUILD_TIME" -lt 300 ]; then
            echo "⚠️ Build time is acceptable (< 5 minutes)" >> build-time-report.md
          else
            echo "❌ Build time is too long (> 5 minutes)" >> build-time-report.md
          fi
          cat build-time-report.md

      - name: Upload build profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-profile-${{ github.run_id }}
          path: build/reports/profile/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build time report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-time-report-${{ github.run_id }}
          path: build-time-report.md
          if-no-files-found: error
          retention-days: 30

  method-count:
    name: Method Count Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDevDebug

      - name: Analyze method count
        run: |
          echo "# Method Count Analysis" > method-count-report.md
          echo "" >> method-count-report.md
          echo "Method count analysis helps track the 64K method limit for Android." >> method-count-report.md
          echo "" >> method-count-report.md
          echo "APK built successfully. Install dexcount plugin for detailed analysis." >> method-count-report.md
          cat method-count-report.md

      - name: Upload method count report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: method-count-report-${{ github.run_id }}
          path: method-count-report.md
          if-no-files-found: error
          retention-days: 30
