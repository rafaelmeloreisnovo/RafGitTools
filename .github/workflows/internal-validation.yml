name: Internal Validation

on:
  workflow_dispatch:
    inputs:
      gradle_args:
        description: 'Extra Gradle args'
        required: false
        default: '--stacktrace --info'
        type: string
  pull_request:
    branches:
      - main
      - develop

env:
  APP_CLIENT_ID_DEV: ${{ vars.APP_CLIENT_ID_DEV || 'local-dev-client-id' }}
  APP_CLIENT_ID_PRODUCTION: ${{ vars.APP_CLIENT_ID_PRODUCTION || 'local-production-client-id' }}
  ALLOW_UNSIGNED_RELEASE: "true"

jobs:
  unsigned-validation:
    name: Unsigned Production Validation Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh
      - name: Generate local.properties
        run: ./scripts/prepare_local_properties.sh
      - name: Test fail-closed Android runtime receipt contract
        run: python3 -m unittest discover -s tests -p 'test_android_runtime_receipt.py' -v
      - name: Build production release (unsigned validation)
        run: ./scripts/gradlew_with_java17.sh assembleProductionRelease ${{ inputs.gradle_args || '--stacktrace --info' }}
      - name: Validate formulas and CI graph consistency
        run: python3 scripts/ci/validate_formulas_graph.py
      - name: Upload formula/graph validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: internal-validation-formulas-graph
          path: build/ci-validation/*

      - name: Upload unsigned validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: internal-validation-unsigned-apk
          path: app/build/outputs/apk/production/release/*.apk
