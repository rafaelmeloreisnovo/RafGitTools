name: Public Data Custody Ingestion

on:
  workflow_dispatch:
    inputs:
      source:
        description: Aggregate public source lane
        required: true
        type: choice
        options:
          - PORTAL_DESPESAS_POR_ORGAO
          - PORTAL_SERVIDORES_POR_ORGAO
      query_json:
        description: JSON query parameters for the allowlisted endpoint
        required: true
        default: '{"pagina":1}'
        type: string

permissions:
  contents: read

jobs:
  ingest-public:
    runs-on: ubuntu-24.04
    environment: Pat_environments
    env:
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate custody tests
        run: python -m pytest -q tests/test_public_data_custody_ingest.py
      - name: Snapshot aggregate official data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/public_data_custody_ingest.py api-snapshot \
            --source "${{ inputs.source }}" \
            --query-json '${{ inputs.query_json }}' \
            --output artifacts/public-data-custody
      - name: Assert no raw person-level payload was persisted
        run: |
          test -f artifacts/public-data-custody/receipt.json
          test -f artifacts/public-data-custody/projection.json
          test ! -e artifacts/public-data-custody/raw.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("artifacts/public-data-custody/receipt.json").read_text())
          assert receipt["claim_allowed"] is False
          assert receipt["raw_source_persisted"] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-data-custody-${{ github.run_id }}
          path: artifacts/public-data-custody/
          retention-days: 30
