name: Drive Snapshot Solo APK
on:
  pull_request:
    paths:
      - 'standalone/drive-snapshot/**'
      - '.github/workflows/drive-snapshot-solo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-test-and-build:
    name: validate and build / solo APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned full SHA
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned full SHA
        with:
          python-version: '3.11'
      - name: Schema and bounded-memory contract checks
        run: python3 standalone/drive-snapshot/tools/test_snapshot_contract.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # pinned full SHA
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # pinned full SHA
      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # pinned full SHA
        with:
          gradle-version: '8.7'
      - name: Compile independent APK (no EstudioAudio/RafGitTools runtime)
        working-directory: standalone/drive-snapshot
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: APK identity and integrity
        working-directory: standalone/drive-snapshot
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS
      - name: Upload solo debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # pinned full SHA
        with:
          name: RAFAELIA-DriveSnapshot-Solo-debug-apk
          path: |
            standalone/drive-snapshot/app/build/outputs/apk/debug/app-debug.apk
            standalone/drive-snapshot/app/build/outputs/apk/debug/SHA256SUMS
          retention-days: 14
