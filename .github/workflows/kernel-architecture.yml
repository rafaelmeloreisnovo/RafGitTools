name: Kernel Architecture Build

on:
  push:
    branches: ['main']
    paths:
      - 'runtime-lock.json'
      - 'kernel/**'
      - 'app/src/main/cpp/**'
      - 'app/src/main/kotlin/com/rafgittools/kernel/**'
      - 'app/src/main/assets/kernel/**'
      - 'scripts/build_llama_kernel.sh'
      - 'scripts/generate_runtime_manifest.sh'
      - 'scripts/runtime_lock_contract.py'
      - 'tests/test_runtime_lock_contract.py'
      - 'tests/test_runtime_manifest_generator.py'
      - '.github/workflows/kernel-architecture.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'runtime-lock.json'
      - 'kernel/**'
      - 'app/src/main/cpp/**'
      - 'app/src/main/kotlin/com/rafgittools/kernel/**'
      - 'app/src/main/assets/kernel/**'
      - 'scripts/build_llama_kernel.sh'
      - 'scripts/generate_runtime_manifest.sh'
      - 'scripts/runtime_lock_contract.py'
      - 'tests/test_runtime_lock_contract.py'
      - 'tests/test_runtime_manifest_generator.py'
      - '.github/workflows/kernel-architecture.yml'
  workflow_dispatch:

concurrency:
  group: kernel-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-kernel:
    name: Assemble RAF Kernel APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout RafGitTools
        uses: actions/checkout@v4

      - name: Test runtime contracts
        run: python3 -m unittest discover -s tests -p 'test_runtime_*.py' -v

      - name: Validate and parse runtime-lock.json
        id: lock
        run: |
          set -euo pipefail
          python3 scripts/runtime_lock_contract.py validate \
            runtime-lock.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout llamaRafaelia @ locked commit
        uses: actions/checkout@v4
        with:
          repository: rafaelmeloreisnovo/llamaRafaelia
          ref: ${{ steps.lock.outputs.llama_commit }}
          path: runtime-src/llama-rafaelia
          token: ${{ secrets.RAF_CROSS_REPO_TOKEN }}

      - name: Checkout RafPolimata @ locked commit
        uses: actions/checkout@v4
        with:
          repository: rafaelmeloreisnovo/RafPolimata
          ref: ${{ steps.lock.outputs.rafpolimata_commit }}
          path: runtime-src/rafpolimata
          token: ${{ secrets.RAF_CROSS_REPO_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Apply formula_ci.zip overlay
        run: bash scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: bash scripts/prepare_local_properties.sh

      - name: Assemble devDebug APK with cognitive kernel
        run: bash scripts/gradlew_with_java17.sh assembleDevDebug

      - name: Generate RUNTIME_MANIFEST.json
        if: always()
        run: |
          bash scripts/generate_runtime_manifest.sh \
            runtime-lock.json \
            app/.cxx \
            RUNTIME_MANIFEST.json

      - name: Verify kernel libraries and APK packaging
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/dev/debug -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo '[FALHA] devDebug APK não foi produzido.' >&2
            exit 1
          fi

          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          sha256sum "$APK"

          mapfile -t KERNEL_LIBS < <(find app/.cxx -type f -name 'libraf_llama_kernel.so' | sort)
          if [ "${#KERNEL_LIBS[@]}" -lt 2 ]; then
            echo "[FALHA] esperadas bibliotecas do kernel para duas ABIs; encontradas: ${#KERNEL_LIBS[@]}" >&2
            printf '%s\n' "${KERNEL_LIBS[@]:-}"
            exit 1
          fi

          for lib in "${KERNEL_LIBS[@]}"; do
            file "$lib"
            sha256sum "$lib"
          done

          APK_ENTRIES=$(unzip -Z1 "$APK")
          for ABI in armeabi-v7a arm64-v8a; do
            ENTRY="lib/${ABI}/libraf_llama_kernel.so"
            if ! grep -Fxq "$ENTRY" <<< "$APK_ENTRIES"; then
              echo "[FALHA] biblioteca obrigatória ausente do APK: $ENTRY" >&2
              exit 1
            fi
            echo "[OK] $ENTRY"
          done

      - name: Validate runtime manifest promotion boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('RUNTIME_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('artifact_state') != 'ARTIFACTS_PRESENT':
              raise SystemExit('runtime manifest did not record ARTIFACTS_PRESENT')
          if manifest.get('artifact_verification_state') != 'HASHED_NOT_PROMOTED':
              raise SystemExit('unexpected artifact verification state')
          if int(manifest.get('artifact_count', 0)) < 2:
              raise SystemExit('runtime manifest must contain at least two ABI artifacts')
          if manifest.get('claim_allowed') is not False:
              raise SystemExit('claim_allowed must remain false before device evidence')
          if not Path('RUNTIME_MANIFEST.json.sha256').is_file():
              raise SystemExit('runtime manifest SHA-256 sidecar is missing')
          print('[OK] runtime manifest artifact boundary')
          PY

      - name: Upload validated kernel APK
        uses: actions/upload-artifact@v4
        with:
          name: kernel-apk-${{ github.run_id }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error

      - name: Upload RUNTIME_MANIFEST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-manifest-${{ github.run_id }}
          path: |
            RUNTIME_MANIFEST.json
            RUNTIME_MANIFEST.json.sha256
          if-no-files-found: warn
