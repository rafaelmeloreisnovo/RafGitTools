name: Debug APK (signed/unsigned)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Debug variant"
        required: true
        default: devDebug
        type: choice
        options:
          - devDebug
          - productionDebug
      generate_unsigned_copy:
        description: "Generate unsigned debug copy (structural analysis only)"
        required: false
        default: false
        type: boolean
      gradle_args:
        description: "Additional Gradle args"
        required: false
        default: "--stacktrace"
        type: string

env:
  GITHUB_CLIENT_ID_DEV: ${{ vars.GITHUB_CLIENT_ID_DEV || 'local-dev-client-id' }}
  GITHUB_CLIENT_ID_PRODUCTION: ${{ vars.GITHUB_CLIENT_ID_PRODUCTION || 'local-production-client-id' }}

jobs:
  build-debug:
    name: Build ${{ inputs.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare scripts
        run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh scripts/apply_formula_ci_zip.sh

      - name: Apply CI overlay
        run: ./scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: ./scripts/prepare_local_properties.sh

      - name: Assemble debug APK
        run: ./scripts/gradlew_with_java17.sh assemble${{ inputs.variant }} ${{ inputs.gradle_args }}

      - name: Resolve APK path
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk_path=$(find app/build/outputs/apk -type f -name "*.apk" | grep -E "/${{ inputs.variant == 'devDebug' && 'dev/debug' || 'production/debug' }}/" | head -n 1)
          if [ -z "$apk_path" ]; then
            echo "::error::APK for ${{ inputs.variant }} not found"
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          ls -lh "$apk_path"

      - name: Generate unsigned copy (non-installable / structural)
        if: inputs.generate_unsigned_copy
        shell: bash
        run: |
          set -euo pipefail
          apk="${{ steps.apk.outputs.apk_path }}"
          unsigned="${apk%.apk}-unsigned-structural.apk"
          cp "$apk" "$unsigned"
          zip -d "$unsigned" 'META-INF/*' >/dev/null || true
          echo "Unsigned structural copy generated: $unsigned"
          ls -lh "$unsigned"

      - name: Verify ABI entries
        shell: bash
        run: |
          set -euo pipefail
          unzip -l "${{ steps.apk.outputs.apk_path }}" | grep -E 'lib/(armeabi-v7a|arm64-v8a)/' || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ inputs.variant }}
          path: |
            app/build/outputs/apk/**/*.apk
          retention-days: 14

      - name: Summary
        shell: bash
        run: |
          echo "## Debug APK build result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Variant: ${{ inputs.variant }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signed debug APK: ${{ steps.apk.outputs.apk_path }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unsigned copy requested: ${{ inputs.generate_unsigned_copy }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.generate_unsigned_copy }}" = "true" ]; then
            echo "- Note: unsigned output is for structural inspection and is not installable." >> "$GITHUB_STEP_SUMMARY"
          fi
