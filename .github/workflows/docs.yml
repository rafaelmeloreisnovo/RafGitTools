name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.14.0

      - name: Resolve changed markdown files
        id: changed-markdown
        shell: bash
        run: |
          set -euo pipefail

          case "${{ github.event_name }}" in
            pull_request)
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
              if [[ "$BASE" =~ ^0+$ ]]; then
                BASE="${HEAD}^"
              fi
              ;;
            workflow_dispatch)
              HEAD="${{ github.sha }}"
              BASE="${HEAD}^"
              ;;
            *)
              echo "Unsupported event: ${{ github.event_name }}" >&2
              exit 2
              ;;
          esac

          git diff --name-only --diff-filter=ACMR -z "$BASE" "$HEAD" -- '*.md' > /tmp/changed-markdown.zlist

          COUNT="$(python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          files = [p for p in raw.split(b'\0') if p]
          print(len(files))
          PY
          )"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Markdown files in audited delta: $COUNT"

          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          for p in (x.decode('utf-8') for x in raw.split(b'\0') if x):
              print(f' - {p}')
          PY

      - name: Check changed markdown files
        if: steps.changed-markdown.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/markdownlint-args
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          for p in (x.decode('utf-8') for x in raw.split(b'\0') if x):
              print(p)
          PY
          mapfile -t FILES < /tmp/markdownlint-args
          markdownlint-cli2 "${FILES[@]}"

      - name: Record documentation no-regression boundary
        shell: bash
        run: |
          echo 'DOC_LINT_SCOPE=CHANGED_OR_NEW_MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          echo 'LEGACY_DEBT_ERASED=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'UNCHANGED_LEGACY_DEBT_IS_NOT_PROMOTED_TO_PASS=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'CHANGED_MARKDOWN_MUST_PASS=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI_PASS != DOCUMENTATION_PERFECTION' >> "$GITHUB_STEP_SUMMARY"

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check.json'
        continue-on-error: true

      - name: Spell check
        uses: rojopolis/spellcheck-github-actions@0.63.0
        with:
          config_path: '.github/spellcheck.yml'
        continue-on-error: true

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: android-actions/setup-android@v4
      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Dokka documentation
        run: |
          # Add Dokka task if available
          ./gradlew dokkaHtml || echo "Dokka not configured"

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: app/build/dokka/
          retention-days: 30
        continue-on-error: true

  check-readme:
    name: Check README Completeness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README sections
        run: |
          echo "Checking README.md for required sections..."

          REQUIRED_SECTIONS=(
            "Overview"
            "Features"
            "Installation"
            "Getting Started"
            "Documentation"
            "Contributing"
            "License"
          )

          MISSING_SECTIONS=()

          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -qi "^#.*$section" README.md; then
              MISSING_SECTIONS+=("$section")
            fi
          done

          if [ ${#MISSING_SECTIONS[@]} -eq 0 ]; then
            echo "✅ All required sections are present in README.md"
          else
            echo "⚠️ Missing sections in README.md:"
            printf '%s\n' "${MISSING_SECTIONS[@]}"
          fi

      - name: Check for broken internal links
        run: |
          echo "Checking for broken internal links in README.md..."

          # Extract markdown links
          grep -o '\[.*\](\.\/.*\.md)' README.md | grep -o '(\.\/.*\.md)' | tr -d '()' | while read -r link; do
            if [ ! -f "$link" ]; then
              echo "⚠️ Broken link: $link"
            fi
          done

          echo "✅ Internal link check complete"
