name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - 'contracts/documentation_no_regression.v1.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - 'contracts/documentation_no_regression.v1.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate documentation no-regression contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('contracts/documentation_no_regression.v1.json')
          if not p.is_file():
              raise SystemExit('FAIL: documentation no-regression contract missing')
          c = json.loads(p.read_text(encoding='utf-8'))
          required = {
              'NEW_DEBT == 0_FOR_CHANGED_MARKDOWN',
              'UNCHANGED_LEGACY_DEBT != PASS',
              'CI_PASS != DOCUMENTATION_PERFECTION',
              'DEBT_DISCOVERED != DEBT_CREATED',
              'LATEST != STRONGER',
          }
          if c.get('claim_allowed') is not False:
              raise SystemExit('FAIL: documentation contract self-promoted')
          if c.get('mode') != 'CHANGED_FILE_STRICT_WITH_LEGACY_DEBT_PRESERVED':
              raise SystemExit('FAIL: unexpected documentation no-regression mode')
          if not required.issubset(set(c.get('invariants', []))):
              raise SystemExit('FAIL: documentation no-regression invariant drift')
          policy = c.get('pull_request_policy', {})
          if policy.get('new_markdown_must_pass_markdownlint') is not True:
              raise SystemExit('FAIL: new Markdown lint gate weakened')
          if policy.get('modified_markdown_must_pass_markdownlint_as_complete_file') is not True:
              raise SystemExit('FAIL: modified Markdown lint gate weakened')
          if c.get('legacy_documentation_debt', {}).get('untouched_legacy_debt_promoted_to_pass') is not False:
              raise SystemExit('FAIL: legacy debt fabricated closed')
          print('PASS: documentation no-regression contract')
          PY

      - name: Install markdownlint-cli2
        run: npm install --global markdownlint-cli2@0.14.0

      - name: Resolve changed markdown files
        id: changed-markdown
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              BASE="$PR_BASE_SHA"
              HEAD="$PR_HEAD_SHA"
              ;;
            push)
              BASE="$BEFORE_SHA"
              HEAD="$CURRENT_SHA"
              if [[ "$BASE" =~ ^0+$ ]]; then
                BASE="${HEAD}^"
              fi
              ;;
            workflow_dispatch)
              HEAD="$CURRENT_SHA"
              BASE="${HEAD}^"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          git diff --name-only --diff-filter=ACMR -z "$BASE" "$HEAD" -- '*.md' > /tmp/changed-markdown.zlist

          COUNT="$(python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          files = [p for p in raw.split(b'\0') if p]
          print(len(files))
          PY
          )"

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Markdown files in audited delta: $COUNT"

          python3 - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          for p in (x.decode('utf-8') for x in raw.split(b'\0') if x):
              print(f' - {p}')
          PY

      - name: Check changed markdown files
        if: steps.changed-markdown.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/markdownlint-args
          from pathlib import Path
          raw = Path('/tmp/changed-markdown.zlist').read_bytes()
          for p in (x.decode('utf-8') for x in raw.split(b'\0') if x):
              print(p)
          PY
          mapfile -t FILES < /tmp/markdownlint-args
          markdownlint-cli2 "${FILES[@]}"

      - name: Record documentation no-regression boundary
        shell: bash
        run: |
          echo 'DOC_LINT_SCOPE=CHANGED_OR_NEW_MARKDOWN' >> "$GITHUB_STEP_SUMMARY"
          echo 'LEGACY_DEBT_ERASED=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'UNCHANGED_LEGACY_DEBT_IS_NOT_PROMOTED_TO_PASS=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'CHANGED_MARKDOWN_MUST_PASS=true' >> "$GITHUB_STEP_SUMMARY"
          echo 'CI_PASS != DOCUMENTATION_PERFECTION' >> "$GITHUB_STEP_SUMMARY"

      - name: Check links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          config-file: '.github/markdown-link-check.json'
        continue-on-error: true

      - name: Spell check
        uses: rojopolis/spellcheck-github-actions@e619e00ca22f01ade9d73048dcd6518bedc552f2 # 0.63.0
        with:
          config_path: '.github/spellcheck.yml'
        continue-on-error: true

  generate-docs:
    name: Generate API Documentation
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Dokka documentation
        run: ./gradlew dokkaHtml || echo "Dokka not configured"

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs-${{ github.run_id }}
          path: app/build/dokka/
          retention-days: 30
        continue-on-error: true

  check-readme:
    name: Check README Completeness
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check README sections
        run: |
          set -euo pipefail
          echo "Checking README.md for required sections..."

          REQUIRED_SECTIONS=(
            "Overview"
            "Features"
            "Installation"
            "Getting Started"
            "Documentation"
            "Contributing"
            "License"
          )

          MISSING_SECTIONS=()

          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -qi "^#.*$section" README.md; then
              MISSING_SECTIONS+=("$section")
            fi
          done

          if [ ${#MISSING_SECTIONS[@]} -eq 0 ]; then
            echo "✅ All required sections are present in README.md"
          else
            echo "⚠️ Missing sections in README.md:"
            printf '%s\n' "${MISSING_SECTIONS[@]}"
          fi

      - name: Check for broken internal links
        run: |
          set -euo pipefail
          echo "Checking for broken internal links in README.md..."
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('README.md').read_text(encoding='utf-8')
          broken = []
          for link in re.findall(r'\[[^]]*\]\((\./[^)]+\.md)\)', text):
              if not Path(link).is_file():
                  broken.append(link)
          for link in broken:
              print(f'⚠️ Broken link: {link}')
          print('✅ Internal link check complete')
          PY
