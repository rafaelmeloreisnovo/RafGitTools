name: One-shot JGitService scope repair

on:
  push:
    branches:
      - hardening/first-compile-run-triangle-20260814

permissions:
  contents: write

concurrency:
  group: jgit-scope-repair-once
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: hardening/first-compile-run-triangle-20260814
          fetch-depth: 2

      - name: Apply exact one-line structural repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/rafgittools/data/git/JGitService.kt')
          text = path.read_text(encoding='utf-8')
          needle = '''                .forEach { ref ->
                    branches.add(ref.toGitBranch(
                        currentBranch = currentBranch,
                        isLocal = false,
                        isRemote = true
                    ))
                }
            }
            
            branches
'''
          replacement = '''                .forEach { ref ->
                    branches.add(ref.toGitBranch(
                        currentBranch = currentBranch,
                        isLocal = false,
                        isRemote = true
                    ))
                }
            
            branches
'''
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'fail-closed: expected exactly one repair site, found {count}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Prove class scope and clean diff
        run: |
          python3 -m unittest tests.test_jgitservice_scope -v
          git diff --check
          git diff -- app/src/main/kotlin/com/rafgittools/data/git/JGitService.kt

      - name: Commit repair and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-jgit-scope-once.yml
          git add app/src/main/kotlin/com/rafgittools/data/git/JGitService.kt
          git commit -m 'fix(git): restore JGitService class scope'
          git push origin HEAD:hardening/first-compile-run-triangle-20260814
