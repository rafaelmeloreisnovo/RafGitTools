# Auto-labeling configuration for actions/labeler v5+
# Keep routing structural only: labels do not imply correctness, evidence,
# scientific validity, legal status, release readiness, or claim promotion.

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**/*'

code:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/*.kt'
          - 'app/src/**/*.java'

ui:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/ui/**/*'
          - 'app/src/**/theme/**/*'
          - 'app/src/main/res/**/*'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/test/**/*'
          - 'app/src/androidTest/**/*'
          - '**/*Test.kt'
          - '**/*Test.java'
          - 'tests/**/*'

build:
  - changed-files:
      - any-glob-to-any-file:
          - '*.gradle'
          - '*.gradle.kts'
          - '**/build.gradle'
          - '**/build.gradle.kts'
          - 'gradle/**/*'
          - 'gradle.properties'

ci/cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**/*'
          - '.github/actions/**/*'
          - '.github/labeler.yml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'gradle/libs.versions.toml'
          - '**/build.gradle'
          - '**/build.gradle.kts'
          - 'requirements/**/*'

git-operations:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/git/**/*'

github-integration:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/github/**/*'
          - 'app/src/**/api/**/*'

security:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/auth/**/*'
          - 'app/src/**/security/**/*'
          - '.github/workflows/codeql.yml'
          - '.github/workflows/security.yml'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/data/**/*'
          - 'app/src/**/database/**/*'
          - 'app/src/**/dao/**/*'

networking:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/src/**/network/**/*'
          - 'app/src/**/api/**/*'

governance:
  - changed-files:
      - any-glob-to-any-file:
          - 'configs/**/*'
          - 'data/evidence/**/*'
          - 'scripts/validate_*.py'
          - 'scripts/validate_*.sh'
