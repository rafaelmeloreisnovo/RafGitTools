# RAFAELIA Dependabot V3: review-only; CI validates the exact dependency PR head.
# GitHub security advisories/alerts and provider configuration remain separate gates.
# A Dependabot PR is a proposal, not approval/merge/license or runtime evidence.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    reviewers:
      - "rafaelmeloreisnovo"
    assignees:
      - "rafaelmeloreisnovo"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # First-match-wins: specific groups MUST precede broad androidx.*.
    # Major upgrades remain individual PRs for a human-reviewed AGP/Kotlin/
    # Gradle/JDK17/KSP/ABI compatibility matrix; never auto-merge.
    # Security updates are not bundled into the version-only groups.
    groups:
      compose:
        applies-to: "version-updates"
        patterns:
          - "androidx.compose.*"
          - "com.google.accompanist.*"
        update-types: ["minor", "patch"]
      hilt:
        applies-to: "version-updates"
        patterns:
          - "com.google.dagger.*"
          - "androidx.hilt.*"
        update-types: ["minor", "patch"]
      kotlin:
        applies-to: "version-updates"
        patterns:
          - "org.jetbrains.kotlin.*"
          - "org.jetbrains.kotlinx.*"
        update-types: ["minor", "patch"]
      testing:
        applies-to: "version-updates"
        patterns:
          - "*junit*"
          - "*mockk*"
          - "*espresso*"
          - "*truth*"
        update-types: ["minor", "patch"]
      networking:
        applies-to: "version-updates"
        patterns:
          - "com.squareup.retrofit2.*"
          - "com.squareup.okhttp3.*"
        update-types: ["minor", "patch"]
      android:
        applies-to: "version-updates"
        patterns:
          - "androidx.*"
          - "com.android.*"
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    reviewers:
      - "rafaelmeloreisnovo"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    allow:
      - dependency-type: "direct"
    groups:
      github-core-actions:
        applies-to: "version-updates"
        patterns:
          - "actions/*"
        update-types: ["minor", "patch"]
      codeql-actions:
        applies-to: "version-updates"
        patterns:
          - "github/codeql-action/*"
        update-types: ["minor", "patch"]
