name: Debug APK (signed/unsigned)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Debug variant"
        required: true
        default: devDebug
        type: choice
        options:
          - devDebug
          - productionDebug
      generate_unsigned_copy:
        description: "Generate unsigned debug copy (structural analysis only)"
        required: false
        default: false
        type: boolean
      gradle_args:
        description: "Additional Gradle flags; use --key=value for flags with values"
        required: false
        default: "--stacktrace"
        type: string

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ inputs.variant }}
  cancel-in-progress: true

env:
  APP_CLIENT_ID_DEV: ${{ vars.APP_CLIENT_ID_DEV || 'local-dev-client-id' }}
  APP_CLIENT_ID_PRODUCTION: ${{ vars.APP_CLIENT_ID_PRODUCTION || 'local-production-client-id' }}

jobs:
  build-debug:
    name: Build ${{ inputs.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Prepare scripts
        run: chmod +x gradlew scripts/gradlew_with_java17.sh scripts/prepare_local_properties.sh scripts/apply_formula_ci_zip.sh

      - name: Apply CI overlay
        run: ./scripts/apply_formula_ci_zip.sh formula_ci.zip

      - name: Prepare local.properties
        run: ./scripts/prepare_local_properties.sh

      - name: Assemble debug APK
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          GRADLE_ARGS_INPUT: ${{ inputs.gradle_args }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            devDebug) gradle_task="assembleDevDebug" ;;
            productionDebug) gradle_task="assembleProductionDebug" ;;
            *)
              echo "::error::Unsupported debug variant: $VARIANT"
              exit 2
              ;;
          esac
          read -r -a gradle_args <<< "$GRADLE_ARGS_INPUT"
          for arg in "${gradle_args[@]}"; do
            case "$arg" in
              -*) ;;
              *)
                echo "gradle_args accepts flags only; use --key=value for values: $arg" >&2
                exit 2
                ;;
            esac
          done
          ./scripts/gradlew_with_java17.sh "$gradle_task" "${gradle_args[@]}"

      - name: Resolve APK path
        id: apk
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          case "$VARIANT" in
            devDebug) apk_dir="app/build/outputs/apk/dev/debug" ;;
            productionDebug) apk_dir="app/build/outputs/apk/production/debug" ;;
            *)
              echo "::error::Unsupported debug variant: $VARIANT"
              exit 2
              ;;
          esac
          apk_path=$(find "$apk_dir" -maxdepth 1 -type f -name "*.apk" -print -quit)
          if [ -z "$apk_path" ] || [ ! -s "$apk_path" ]; then
            echo "::error::Non-empty APK for $VARIANT not found"
            exit 1
          fi
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "apk_dir=$apk_dir" >> "$GITHUB_OUTPUT"
          ls -lh "$apk_path"

      - name: Generate unsigned copy (non-installable / structural)
        if: inputs.generate_unsigned_copy
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          unsigned="${APK_PATH%.apk}-unsigned-structural.apk"
          cp "$APK_PATH" "$unsigned"
          zip -d "$unsigned" 'META-INF/*' >/dev/null || true
          echo "Unsigned structural copy generated: $unsigned"
          ls -lh "$unsigned"

      - name: Verify required ABI entries
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a; do
            if ! unzip -l "$APK_PATH" | grep -q "lib/${abi}/"; then
              echo "::error::Required ABI missing from APK: ${abi}"
              exit 1
            fi
            echo "ABI present: ${abi}"
          done

      - name: Write APK checksum
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          APK_DIR: ${{ steps.apk.outputs.apk_dir }}
        run: |
          set -euo pipefail
          sha256sum "$APK_PATH" | tee "$APK_DIR/SHA256SUMS.txt"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk-${{ inputs.variant }}-${{ github.run_id }}
          path: |
            ${{ steps.apk.outputs.apk_dir }}/*.apk
            ${{ steps.apk.outputs.apk_dir }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Summary
        shell: bash
        env:
          VARIANT: ${{ inputs.variant }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          UNSIGNED_REQUESTED: ${{ inputs.generate_unsigned_copy }}
        run: |
          set -euo pipefail
          {
            echo "## Debug APK build result"
            echo "- Variant: \`$VARIANT\`"
            echo "- Signed debug APK: \`$APK_PATH\`"
            echo "- Required ABIs: armeabi-v7a + arm64-v8a"
            echo "- SHA-256: recorded in SHA256SUMS.txt"
            echo "- Unsigned copy requested: \`$UNSIGNED_REQUESTED\`"
            if [ "$UNSIGNED_REQUESTED" = "true" ]; then
              echo "- Note: unsigned output is for structural inspection and is not installable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
