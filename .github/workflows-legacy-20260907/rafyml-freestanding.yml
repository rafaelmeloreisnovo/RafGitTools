name: RAFYML Freestanding Gate

on:
  push:
    branches: [main]
    paths:
      - "tools/rafymlc/**"
      - "include/rafyml_runtime.h"
      - "src/rafyml_runtime.c"
      - "examples/rafyml/**"
      - "tests/test_rafymlc.py"
      - "scripts/ci/validate_rafyml_freestanding.py"
      - ".github/workflows/rafyml-freestanding.yml"
  pull_request:
    paths:
      - "tools/rafymlc/**"
      - "include/rafyml_runtime.h"
      - "src/rafyml_runtime.c"
      - "examples/rafyml/**"
      - "tests/test_rafymlc.py"
      - "scripts/ci/validate_rafyml_freestanding.py"
      - ".github/workflows/rafyml-freestanding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rafyml-freestanding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run deterministic freestanding gate
        run: python3 scripts/ci/validate_rafyml_freestanding.py
