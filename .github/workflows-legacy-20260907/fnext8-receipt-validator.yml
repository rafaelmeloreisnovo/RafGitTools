name: FNEXT8 Receipt Validator

on:
  push:
    branches:
      - main
      - rafaelia/fnext8-20260906
    paths:
      - 'scripts/rafaelia_receipt_validator.py'
      - 'tests/test_rafaelia_receipt_validator.py'
      - 'data/evidence/github/fnext8-20260906.receipts.v1.json'
      - '.github/workflows/fnext8-receipt-validator.yml'
  pull_request:
    paths:
      - 'scripts/rafaelia_receipt_validator.py'
      - 'tests/test_rafaelia_receipt_validator.py'
      - 'data/evidence/github/fnext8-20260906.receipts.v1.json'
      - '.github/workflows/fnext8-receipt-validator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fnext8-receipt-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-receipts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run validator unit tests
        run: python3 tests/test_rafaelia_receipt_validator.py

      - name: Validate FNEXT8 seven-receipt bundle
        run: |
          mkdir -p .rafaelia-artifacts/fnext8
          python3 scripts/rafaelia_receipt_validator.py \
            data/evidence/github/fnext8-20260906.receipts.v1.json \
            > .rafaelia-artifacts/fnext8/receipt-validation-report.json
          cat .rafaelia-artifacts/fnext8/receipt-validation-report.json

      - name: Hash validation inputs and report
        run: |
          sha256sum \
            scripts/rafaelia_receipt_validator.py \
            tests/test_rafaelia_receipt_validator.py \
            data/evidence/github/fnext8-20260906.receipts.v1.json \
            .rafaelia-artifacts/fnext8/receipt-validation-report.json \
            > .rafaelia-artifacts/fnext8/SHA256SUMS
          cat .rafaelia-artifacts/fnext8/SHA256SUMS

      - name: Upload fail-closed validation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fnext8-receipt-validation-${{ github.run_id }}-${{ github.sha }}
          path: .rafaelia-artifacts/fnext8/
          if-no-files-found: error
          retention-days: 30
