name: Code Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDevDebugUnitTest

      - name: Detect coverage capability
        id: coverage_capability
        shell: bash
        run: |
          set -euo pipefail
          if ./gradlew tasks --all | grep -Eq '(^|[[:space:]])jacocoTestReport([[:space:]]|$)'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "coverage_state=READY_TO_GENERATE" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "coverage_state=TOKEN_VAZIO_COVERAGE_NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate coverage report
        if: steps.coverage_capability.outputs.available == 'true'
        run: ./gradlew jacocoTestReport

      - name: Detect coverage artifacts
        id: coverage_artifacts
        shell: bash
        env:
          COVERAGE_AVAILABLE: ${{ steps.coverage_capability.outputs.available }}
        run: |
          set -euo pipefail
          found=false
          for dir in app/build/reports/jacoco app/build/reports/coverage; do
            if [ -d "$dir" ] && find "$dir" -type f -print -quit | grep -q .; then
              found=true
            fi
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "evidence_state=EVIDENCED_SCOPED_COVERAGE_REPORT" >> "$GITHUB_OUTPUT"
          elif [ "$COVERAGE_AVAILABLE" = true ]; then
            echo "evidence_state=TOKEN_VAZIO_COVERAGE_REPORT_NOT_EMITTED" >> "$GITHUB_OUTPUT"
          else
            echo "evidence_state=TOKEN_VAZIO_COVERAGE_NOT_CONFIGURED" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage reports
        if: steps.coverage_artifacts.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports-${{ github.run_id }}
          path: |
            app/build/reports/jacoco/
            app/build/reports/coverage/
          if-no-files-found: error
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVIDENCE_STATE: ${{ steps.coverage_artifacts.outputs.evidence_state }}
          ARTIFACT_FOUND: ${{ steps.coverage_artifacts.outputs.found }}
        with:
          script: |
            const evidenceState = process.env.EVIDENCE_STATE || 'TOKEN_VAZIO_NOT_OBSERVED';
            const artifactFound = process.env.ARTIFACT_FOUND === 'true';

            let comment = '## 📊 Code Coverage Report\n\n';
            comment += '### Observed state\n';
            comment += '- Unit tests completed ✅\n';
            comment += `- Coverage evidence: \`${evidenceState}\`\n`;
            if (artifactFound) {
              comment += '- Coverage artifact uploaded ✅\n';
            } else {
              comment += '- Coverage artifact not emitted; no coverage percentage is claimed.\n';
            }
            comment += '\n`claim_allowed=false` for any coverage claim not backed by an emitted report.\n';

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
