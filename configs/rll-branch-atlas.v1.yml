schema: rafgittools.rll-branch-atlas.v1
version: 1.0.0
claim_allowed: false

targets:
  - instituto-Rafael/relativity-living-light
  - rafaelmeloreisnovo/RafGitTools

prefix_order:
  - 00-anchor
  - 05-lab
  - 10-science
  - 20-data
  - 30-math-geometry
  - 40-runtime-work
  - 50-docs-papers
  - 60-ci-release
  - 70-governance-security
  - 80-audit-evidence
  - 90-agent-automation
  - 95-legacy-unclassified

rename_policy:
  mode: fail_closed
  bulk_rename: false
  anchors:
    - main
    - rll/lab
  required_before_each_rename:
    - OPEN_PR_REFERENCE_SCAN
    - WORKFLOW_TRIGGER_REFERENCE_SCAN
    - BRANCH_PROTECTION_READBACK
    - PAGES_OR_DOC_LINK_REFERENCE_SCAN
  unresolved_state: TOKEN_VAZIO_RENAME_DEPENDENCY

pages:
  source: docs/site/rll-atlas/
  provider_configuration: TOKEN_VAZIO_PAGES_PROVIDER_CONFIGURATION
  content_can_exist_without_provider_deploy: true

provider_capabilities:
  PAT_ACTIONS:
    state: WIRED_MAIN_ONESHOT_READ_ONLY
    atlas_use: NOT_EXPANDED
  PAT_ENV:
    state: WIRED_MANUAL_ONLY
    atlas_use: NOT_USED_FOR_CONTENT_OR_BRANCH_ENUMERATION
  PAT_AGENTS:
    state: REGISTERED_NOT_WIRED
    atlas_use: TOKEN_VAZIO_PERMISSION_PROBE_REQUIRED
  PAT_CODESPACES:
    state: REGISTERED_NOT_WIRED
    atlas_use: TOKEN_VAZIO_PERMISSION_PROBE_REQUIRED
  PAT_DEPENDABOT:
    state: REGISTERED_NOT_WIRED
    atlas_use: TOKEN_VAZIO_PERMISSION_PROBE_REQUIRED

invariants:
  - NO_PAT_FALLBACK
  - SECRET_VALUE_NEVER_PERSISTED_OR_PRINTED
  - CAPABILITY != PERMISSION
  - REGISTERED != WIRED
  - SOURCE != EXECUTION != EVIDENCE != CLAIM
  - TOKEN_VAZIO != PASS
