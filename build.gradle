// Top-level build file where you can add configuration options common to all sub-projects/modules.
// This version pins the Android Gradle Plugin, Kotlin, Hilt, KSP and Compose
// compiler versions used by the app. Keep the Gradle wrapper aligned with
// the minimum Gradle version required by the selected AGP.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://repo.eclipse.org/content/groups/releases/') }
    }
    dependencies {
        // Isolated AGP 9.1.1 / API 37 AAR-compatibility candidate (not a release).
        // Kotlin2/Compose2/KSP2 scoped candidate; CI admission is not a release approval.
        classpath 'com.android.tools.build:gradle:9.1.1'

        // Kotlin2.4.21, Compose2.4.21, KSP2.3.10 coordinated CI-only trial.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'

        // Hilt for dependency injection.  Version 2.48 is stable and supports
        // AGP 8+.
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.48'
    }
}

plugins {
    // KSP 2.3.10 independently versioned, integration not yet verified.
    id 'com.google.devtools.ksp' version '2.3.10' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21' apply false
}

// Keep the clean task definition
tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
