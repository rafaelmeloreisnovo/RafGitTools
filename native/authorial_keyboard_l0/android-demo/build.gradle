plugins { id 'com.android.application' }
android {
  namespace 'io.rafaelia.keyboard.demo'
  compileSdk 34
  defaultConfig {
    applicationId 'io.rafaelia.keyboard.demo'
    minSdk 24
    targetSdk 28
    versionCode 1
    versionName '0.1.0-native-experimental'
    ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    externalNativeBuild {
      ndkBuild { arguments 'NDK_APPLICATION_MK=src/main/jni/Application.mk' }
    }
  }
  externalNativeBuild { ndkBuild { path 'src/main/jni/Android.mk' } }
  buildTypes { release { minifyEnabled false } }
}
